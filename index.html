<style>
/* ===== Embedded fallback stylesheet (works with NO CDN at all) ===== */
/* Layout */
.hidden{display:none!important}
.flex{display:flex}.grid{display:grid}
.items-center{align-items:center}.items-end{align-items:flex-end}
.justify-center{justify-content:center}.justify-between{justify-content:space-between}
.flex-1{flex:1 1 0%}.flex-wrap{flex-wrap:wrap}.block{display:block}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gap-1{gap:.25rem}.gap-2{gap:.5rem}
.min-h-screen{min-height:100vh}
.mx-auto{margin-left:auto;margin-right:auto}
.w-full{width:100%}
.max-w-sm{max-width:24rem}.max-w-3xl{max-width:48rem}
.min-w-\[110px\]{min-width:110px}.min-w-\[140px\]{min-width:140px}
.text-center{text-align:center}.text-right{text-align:right}
.overflow-x-auto{overflow-x:auto}
/* Spacing */
.p-2{padding:.5rem}.p-3{padding:.75rem}.p-4{padding:1rem}.p-6{padding:1.5rem}
.py-2{padding-top:.5rem;padding-bottom:.5rem}.pt-3{padding-top:.75rem}.pb-2{padding-bottom:.5rem}.pb-24{padding-bottom:6rem}
.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}
.mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
.my-2{margin-top:.5rem;margin-bottom:.5rem}
/* Typography */
.text-\[11px\]{font-size:11px}.text-xs{font-size:.75rem}.text-sm{font-size:.875rem}
.text-lg{font-size:1.125rem}.text-xl{font-size:1.25rem}.text-5xl{font-size:3rem;line-height:1}
.font-bold{font-weight:700}
/* High-contrast colors (brightened for legibility) */
.text-slate-300{color:#e2e8f0}.text-slate-400{color:#cbd5e1}.text-slate-500{color:#94a3b8}
.text-red-400{color:#f87171}.text-emerald-400{color:#34d399}.text-pink-400{color:#f472b6}
.text-amber-300{color:#fcd34d}.text-amber-400{color:#fbbf24}
.text-sky-400{color:#38bdf8}
.border-slate-600{border-color:#475569}.border-slate-700{border-color:#334155}
.border-b{border-bottom:1px solid #334155}.border-t{border-top:1px solid #334155}
/* Base look & feel (independent of Tailwind) */
html,body{margin:0;padding:0;background:#0f172a;color:#f1f5f9}
body{-webkit-text-size-adjust:100%}
input,select{box-sizing:border-box;outline:none}

*{font-family:Vazirmatn,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f172a;color:#e2e8f0}
.card{background:#1e293b;border:1px solid #334155;border-radius:1rem}
input,select{background:#0f172a;border:1px solid #334155;border-radius:.5rem;padding:.55rem;color:#e2e8f0;width:100%;font-size:16px}/*16px => جلوگیری از زوم در iOS/اندروید*/
.btn{border-radius:.6rem;padding:.55rem .9rem;font-weight:600;cursor:pointer;min-height:42px}
.btn-p{background:#ec4899;color:#fff}.btn-s{background:#334155;color:#e2e8f0}.btn-d{background:#7f1d1d;color:#fff}
.btn-g{background:#059669;color:#fff}.btn-a{background:#d97706;color:#fff}
table{width:100%;font-size:.85rem}th,td{padding:.4rem;border-bottom:1px solid #334155;text-align:right}

.tabbtn.active{background:#ec4899;color:#fff}

.badge{font-size:.7rem;padding:.15rem .55rem;border-radius:999px}

body.light .low td,body.light .low{background:#fee2e2!important;color:#7f1d1d!important}

.cat-row .nm{flex:1}
.cat-pick{display:block;width:100%;text-align:right;background:transparent;color:inherit;border:none;padding:.55rem .5rem;border-bottom:1px solid #334155;cursor:pointer;font-size:.95rem}

.cat-pick.sel{background:#ec489933}

/* ================= ذخیره‌سازی مقاوم (هرگز داده از دست نمی‌رود) ================= */
const LS={p:'cpos_products',i:'cpos_invoices',e:'cpos_expenses',s:'cpos_settings',c:'cpos_categories'};

function applyStoreBranding(){
 const name = (settings && settings.store_name) ? settings.store_name : 'فروشگاه آسان';
 const logo = (settings && settings.store_logo) ? settings.store_logo : DEFAULT_LOGO;
 const elLoginName = document.getElementById('loginStoreName');
 if(elLoginName) elLoginName.textContent = name;
 const elHeaderName = document.getElementById('headerStoreName');
 if(elHeaderName) elHeaderName.textContent = name;
 const elLoginLogo = document.getElementById('loginLogo');
 if(elLoginLogo) elLoginLogo.src = logo;
 const elHeaderLogo = document.getElementById('headerLogo');
 if(elHeaderLogo) elHeaderLogo.src = logo;
 document.title = name + ' — صندوق و حسابداری';
}

function lsGet(k,d){
 try{const raw=localStorage.getItem(k);if(raw==null)return d;const v=JSON.parse(raw);return v??d;}
 catch(e){console.error('localStorage read failed',k,e);return d;}
}
function lsSet(k,v){
 try{localStorage.setItem(k,JSON.stringify(v));return true;}
 catch(e){
  toast('⚠ خطا در ذخیره‌سازی! فضای مرورگر پر است یا دسترسی مسدود است');
  try{const bak={k:JSON.parse(localStorage.getItem(k))};/* keep old */}catch(_){}
  // پشتیبان درون‌حافظه‌ای تا پایان نشست
  window['mem_'+k]=v;return false;
 }
}
function toast(msg,ok=true){
 const t=document.createElement('div');t.className='toast'+(ok?'':' !bg-red-600');t.textContent=msg;
 document.getElementById('toastBox').appendChild(t);
 setTimeout(()=>t.remove(),2600);
}
const SEED=[
 ['6001001','شامپو ترمیم‌کننده','سی‌گنیفیک','شامپو',85000,120000,10,12],
 ['6001002','کرم دست نرم‌کننده','پارمیدا','کرم',40000,65000,10,8],
 ['6001003','رژ لب مات','نوت','آرایش',120000,175000,10,5],
 ['6001004','لاک ناخن','میکارون','آرایش',55000,90000,10,3],
 ['6001005','کرم ضدآفتاب SPF50','درماتیپیکس','ضدآفتاب',180000,245000,10,7],
 ['6001006','شامپوی بچه','بی‌بی','شامپو',60000,85000,10,4]
];
function migrateProducts(list){
 // سازگاری با نسخه‌های قبلی و اطمینان از فیلدهای مالی
 return (list||[]).map(p=>({
  barcode:String(p.barcode||''),name:p.name||'',brand:p.brand||'',category:p.category||'',
  purchase_price:+p.purchase_price||0,sale_price:+p.sale_price||0,
  vat_percent:(p.vat_percent==null?10:+p.vat_percent),stock:+p.stock||0
 }));
}
let products=migrateProducts(lsGet(LS.p,null));
if(!products||!products.length){products=migrateProducts(SEED.map(r=>({barcode:r[0],name:r[1],brand:r[2],category:r[3],purchase_price:r[4],sale_price:r[5],vat_percent:r[6],stock:r[7]})));lsSet(LS.p,products);}
let invoices=lsGet(LS.i,[]);if(!Array.isArray(invoices))invoices=[];
let expenses=lsGet(LS.e,[]);if(!Array.isArray(expenses))expenses=[];
let settings=Object.assign({income_tax_percent:15,operating_expense_monthly:0,store_name:'فروشگاه آسان',store_address:'',store_phone:'',store_logo:'',theme:'dark'},lsGet(LS.s,{}));
function applyTheme(){const l=settings.theme==='light';document.body.classList.toggle('light',l);document.documentElement.classList.toggle('light',l);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=l?'#f8fafc':'#0f172a';}
applyTheme();
/* دسته‌بندی درختی: {id,name,parent} */
let categories=lsGet(LS.c,null);
if(!Array.isArray(categories)){categories=[];const seen={};products.forEach(p=>{const n=(p.category||'').trim();if(n&&!seen[n]){seen[n]=1;categories.push({id:'c'+Date.now().toString(36)+categories.length,name:n,parent:null});}});lsSet(LS.c,categories);}
let cart=[], user=null;

const fmt=n=>Number(n||0).toLocaleString('fa-IR');
const fmoney=n=>fmt(Math.round(n))+' تومان';
/* تاریخ شمسی (جلالی) — تقویم واقعی fa-IR-u-ca-persian */
const jdate=d=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}catch(e){return new Date(d).toLocaleDateString('fa-IR');}};
const jdatetime=d=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d);}catch(e){return new Date(d).toLocaleString('fa-IR');}};
const jmonthYear=d=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long'}).format(d);}catch(e){return jdate(d);}};
document.getElementById('todayJ').textContent='📅 '+jdate(new Date());
</script>
<script>
/* ================= نقش‌ها و ناوبری (تمایز کامل مدیر/فروشنده/حسابدار) ================= */
const USERS={
 admin:{pass:'1234',role:'مدیر',cls:'role-admin',tabs:['pos','categories','products','inventory','reports','expenses','settings']},
 seller:{pass:'1111',role:'فروشنده',cls:'role-seller',tabs:['pos','products']},
 acc:{pass:'2222',role:'حسابدار',cls:'role-acc',tabs:['reports','expenses','inventory','settings']}
};
const TAB_LABELS={pos:'🛒 صندوق فروش',categories:'🗂 دسته محصولات',products:'📦 محصولات',inventory:'📊 موجودی',reports:'📈 حسابداری و سود و زیان',expenses:'💸 هزینه‌ها',settings:'⚙ تنظیمات'};
let curTab='pos';

function doLogin(){
 const u=document.getElementById('liUser').value.trim().toLowerCase();
 const p=document.getElementById('liPass').value.trim();
 const err=document.getElementById('liErr');
 if(USERS[u]&&USERS[u].pass===p){
  user={username:u,...USERS[u]};
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  const w=document.getElementById('whoami');w.textContent=user.role;w.className='badge '+user.cls;
  curTab=user.tabs[0];renderTabs();renderTab();err.textContent='';

function toCanvas(source, maxDim = 1400) {

async function runMultiPassDetection(src, onProgress) {

    cropCanvas(big, 0, 0.3, 1, 0.4),
    cropCanvas(big, 0, 0.5, 1, 0.5),
    cropCanvas(big, 0, 0, 1, 0.5),
    scaleCanvas(big, 800)

    for (const deg of [90, 180, 270]) { const c = await bdDetect(rotateCanvas(v, deg)); if (c) return c; }

  return null;
}

async function startCamera() {

function stopCamera() {
  if (scanLoopTimer) { clearTimeout(scanLoopTimer); scanLoopTimer = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); scanStream = null; }
  if (liveH5) { try { liveH5.clear(); } catch (e) {} liveH5 = null; }
  scanBusy = false;
}

async function captureAndAnalyzeFrame() {
  const btn = document.getElementById('btnCaptureAnalyze');
  const video = document.getElementById('scanVideo');
  if (!video || !video.videoWidth) { setScanMsg('', 'دوربین آماده نیست؛ از «عکس با دوربین گوشی» یا گالری استفاده کنید.'); return; }
  if (btn) btn.disabled = true;
  try {
    const cv = toCanvas(video, 1920);
    setScanMsg('در حال تحلیل فریم...', '');
    const code = await runMultiPassDetection(cv, m => setScanMsg(m));
    if (code) onDecoded(code);
    else setScanMsg('', 'بارکد شناسایی نشد؛ نزدیک‌تر/واضح‌تر بگیرید یا دستی وارد کنید.');
  } catch (e) { setScanMsg('', 'خطا: ' + (e.message || e)); }
  finally { if (btn) btn.disabled = false; }
}

function loadImageFile(f) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f);
    const i = new Image();
    i.onload = () => { URL.revokeObjectURL(url); res(i); };
    i.onerror = () => { URL.revokeObjectURL(url); rej(new Error('فرمت تصویر پشتیبانی نمی‌شود (HEIC را به JPG تبدیل کنید)')); };
    i.src = url;
  });
}
async function scanFromFile(input) {
  const f = input.files && input.files[0];
  input.value = ''; // تا انتخاب دوبارهٔ همان فایل هم کار کند
  if (!f) return;
  setScanMsg('در حال باز کردن تصویر...', '');
  try {
    let src;
    if (window.createImageBitmap) { try { src = await createImageBitmap(f, { imageOrientation: 'from-image' }); } catch (e) { src = null; } }
    if (!src) src = await loadImageFile(f);
    const cv = toCanvas(src, 2000);
    if (!cv) throw new Error('تبدیل تصویر ناموفق بود');
    const code = await runMultiPassDetection(cv, m => setScanMsg(m));
    if (code) onDecoded(code);
    else setScanMsg('', 'بارکد در تصویر یافت نشد؛ عکس نزدیک‌تر و بدون تاری از خود بارکد بگیرید یا دستی وارد کنید.');
  } catch (e) { setScanMsg('', 'خطا در پردازش تصویر: ' + (e.message || e)); }
}

function submitManualBarcodeFromModal() {
  const inp = document.getElementById('manualBarcodeModalInput');
  const v = inp ? inp.value.trim() : '';
  if (!v) { setScanMsg('', 'لطفاً کد بارکد را وارد کنید.'); return; }
  onDecoded(v);
}
function onDecoded(txt) {
  if (scanDone) return;
  scanDone = true;
  txt = String(txt).trim().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
  const cb = scanCb;
  closeScanModal();
  if (cb) cb(txt);
}
function closeScanModal() {
  stopCamera();
  const m = document.getElementById('scanModal');
  if (m) { m.classList.add('hidden'); m.innerHTML = ''; }
}
function stopScan() { closeScanModal(); }
window.addEventListener('beforeunload', stopCamera);
document.addEventListener('visibilitychange', () => { if (document.hidden && scanStream) closeScanModal(); });
</script>

<script>

function renderInventory(){

 if(p){p.stock=Math.max(0,p.stock+d);lsSet(LS.p,products);renderInventory();}

<script>
/* ================= صندوق فروش ================= */
function renderPOS(){
 const c=document.getElementById('content');
 c.innerHTML=`<div class="card p-3 mb-3">
  <div class="flex gap-2"><input id="posSearch" placeholder="جستجوی نام یا بارکد" oninput="showMatches()">
   <button class="btn btn-p" onclick="scanForPOS()">اسکن</button></div>
  <div id="posMatches" class="mt-2"></div>
 </div>
 <div class="card p-3"><h2 class="font-bold mb-2">سبد خرید</h2><div id="cartRows"></div>
  <div id="cartTotals" class="border-t border-slate-600 mt-3 pt-3"></div>
  <button class="btn btn-p w-full mt-3" onclick="checkout()">ثبت فروش</button>
 </div><div id="receipt" class="mt-3"></div>`;
 drawCart();
}
function showMatches(){
 const q=document.getElementById('posSearch').value.trim().toLowerCase();
 const found=products.filter(p=>q&&(p.name.toLowerCase().includes(q)||p.barcode.includes(q))).slice(0,8);
 document.getElementById('posMatches').innerHTML=found.map(p=>`<button class="card block w-full text-right p-2 mb-1" onclick="addCart('${esc(p.barcode)}')">${esc(p.name)} — ${fmoney(p.sale_price)} (موجودی ${fmt(p.stock)})</button>`).join('');
}
function scanForPOS(){openScanModal(code=>{
 const p=products.find(x=>x.barcode===code);
 if(p)addCart(code); else toast('محصولی با بارکد '+code+' ثبت نشده است',false);
});}
function addCart(code){
 const p=products.find(x=>x.barcode===code);if(!p)return;
 if(p.stock<=0){toast('موجودی کافی نیست',false);return;}
 const row=cart.find(x=>x.barcode===code);
 if(row){if(row.qty>=p.stock){toast('موجودی کافی نیست',false);return;}row.qty++;}
 else cart.push({barcode:code,qty:1});
 drawCart();
}
function setQty(code,val){
 const row=cart.find(x=>x.barcode===code),p=products.find(x=>x.barcode===code);if(!row)return;
 row.qty=Math.max(1,Math.min(p.stock,Math.round(+val||1)));drawCart();
}
function removeCart(code){cart=cart.filter(x=>x.barcode!==code);drawCart();}
/* محاسبات مالی درست:
   sale_price = قیمت فروش بدون مالیات. ماليات فروش جدا محاسبه و به مشتری اضافه می‌شود.
   سود ناخالص = (فروش − بهای تمام‌شده خرید) × تعداد   */
function cartMath(){
 let net=0,vat=0,profit=0;
 for(const row of cart){const p=products.find(x=>x.barcode===row.barcode);if(!p)continue;
  const line=p.sale_price*row.qty;
  net+=line;vat+=line*(p.vat_percent||0)/100;
  profit+=(p.sale_price-p.purchase_price)*row.qty;}
 return {net,vat,grand:net+vat,profit};
}
function drawCart(){
 const rows=document.getElementById('cartRows');if(!rows)return;
 rows.innerHTML=cart.length?cart.map(r=>{const p=products.find(x=>x.barcode===r.barcode);if(!p)return '';return `<div class="flex items-center gap-2 py-2 border-b border-slate-700 flex-wrap">
 <div class="flex-1 min-w-[110px]"><b>${esc(p.name)}</b><div class="text-xs text-slate-400">${fmoney(p.sale_price)} ×</div></div>
 <input type="number" min="1" max="${p.stock}" value="${r.qty}" style="width:70px" onchange="setQty('${esc(p.barcode)}',this.value)" inputmode="numeric">
 <span>${fmoney(p.sale_price*r.qty)}</span><button class="text-red-400" onclick="removeCart('${esc(p.barcode)}')">✕</button></div>`}).join(''):'<p class="text-slate-400">سبد خالی است</p>';
 const m=cartMath();
 document.getElementById('cartTotals').innerHTML=
  `<div class="flex justify-between"><span>جمع کالا (بدون مالیات)</span><b>${fmoney(m.net)}</b></div>
   <div class="flex justify-between text-amber-300"><span>مالیات ارزش افزوده</span><b>${fmoney(m.vat)}</b></div>
   <div class="flex justify-between text-lg text-pink-400"><span>مبلغ قابل پرداخت</span><b>${fmoney(m.grand)}</b></div>`;
}
function checkout(){
 if(!cart.length){toast('سبد خرید خالی است',false);return;}
 for(const r of cart){const p=products.find(x=>x.barcode===r.barcode);if(!p||p.stock<r.qty){toast('موجودی برای '+(p?p.name:'محصول')+' کافی نیست',false);return;}}
 const m=cartMath();
 const items=cart.map(r=>{const p=products.find(x=>x.barcode===r.barcode);
  const line=p.sale_price*r.qty;
  return {barcode:p.barcode,name:p.name,brand:p.brand,qty:r.qty,purchase_price:p.purchase_price,sale_price:p.sale_price,vat_percent:p.vat_percent,
   line_total:line,vat:line*(p.vat_percent||0)/100,cogs:p.purchase_price*r.qty,gross_profit:(p.sale_price-p.purchase_price)*r.qty};});
 const inv={id:Date.now(),date:new Date().toISOString(),jalali_date:jdate(new Date()),
  seller:user.username,seller_name:user.role,items,
  revenue:m.net,cogs:items.reduce((s,i)=>s+i.cogs,0),
  gross_profit:m.profit,vat:m.vat,total:m.grand};
 for(const r of cart){const p=products.find(x=>x.barcode===r.barcode);p.stock-=r.qty;}
 invoices.push(inv);lsSet(LS.i,invoices);lsSet(LS.p,products);cart=[];drawCart();
 document.getElementById('receipt').innerHTML=`<div class="card p-4">
  <h3 class="font-bold mb-1">✅ فروش ثبت شد</h3>
  <p class="text-sm">فاکتور: ${fmt(inv.id)}</p><p class="text-sm">تاریخ: ${jdatetime(inv.date)}</p><p class="text-sm">فروشنده: ${esc(inv.seller_name)}</p>
  <p class="text-sm">مبلغ کالا: ${fmoney(inv.revenue)}</p><p class="text-sm text-amber-300">مالیات: ${fmoney(inv.vat)}</p>
  <b class="text-pink-400">مبلغ نهایی: ${fmoney(inv.total)}</b></div>`;
 toast('فروش با موفقیت ثبت شد');
}
</script>
<script>
/* ================= حسابداری: سود و زیان، ارزش افزوده، مالیات عملکرد ================= */
const PERCENT=n=>fmt(n)+'٪';
function plStatement(invList,expList){
 // درآمد = فروش بدون مالیات (مالیات ارزش افزوده بر عهده مشتری و بدهی به سازمان امور مالیاتی است)
 const revenue=invList.reduce((s,i)=>s+(i.revenue??i.subtotal??0),0);
 const cogs=invList.reduce((s,i)=>s+(i.cogs??i.items.reduce((x,it)=>x+(it.cogs??(it.purchase_price||0)*(it.qty||0)),0)),0);
 const grossProfit=revenue-cogs;
 const vatCollected=invList.reduce((s,i)=>s+(i.vat||0),0);
 // مالیات خرید ورودی (credit) تقریبی: 10٪ بهای تمام‌شده اقلام با vat_percent>0
 const vatPaid=invList.reduce((s,i)=>s+i.items.reduce((x,it)=>x+((it.vat_percent||0)>0?(it.cogs??(it.purchase_price||0)*(it.qty||0))*0.10:0),0),0);
 const vatPayable=Math.max(0,vatCollected-vatPaid);
 const opex=expList.reduce((s,e)=>s+(+e.amount||0),0);
 const netProfit=grossProfit-opex;
 const taxRate=(+settings.income_tax_percent||0)/100;
 // ماليات عملکرد: بر سود مشمول (سود خالص مثبت) — نرخ قابل تنظیم (پیش‌فرض 15٪)
 const taxable=Math.max(0,netProfit);
 const incomeTax=taxable*taxRate;
 const afterTax=netProfit-incomeTax;
 return {revenue,cogs,grossProfit,vatCollected,vatPaid,vatPayable,opex,netProfit,taxRate:taxRate*100,taxable,incomeTax,afterTax,
  invoiceCount:invList.length,marginPct:revenue>0?grossProfit/revenue*100:0};
}
function renderReports(){
 const c=document.getElementById('content');
 const monthFilterSel=`<select id="repPeriod" class="mb-3" onchange="renderReports()">
  <option value="all">کل دوره</option>
  <option value="month" ${repPeriod==='month'?'selected':''}>ماه جاری (شمسی)</option>
  <option value="week" ${repPeriod==='week'?'selected':''}>۷ روز اخیر</option>
 </select>`;
 let invList=invoices,expList=expenses;
 const now=new Date();
 if(repPeriod==='month'){
  // ماه شمسی جاری: فیلتر با رشته تاریخ شمسی سال/ماه
  const mp=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit'}).format(now);
  invList=invoices.filter(i=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit'}).format(new Date(i.date))===mp}catch(e){return false}});
  expList=expenses.filter(e=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit'}).format(new Date(e.date))===mp}catch(e){return false}});
 } else if(repPeriod==='week'){
  const cut=now.getTime()-7*24*3600*1000;
  invList=invoices.filter(i=>new Date(i.date).getTime()>=cut);
  expList=expenses.filter(e=>new Date(e.date).getTime()>=cut);
 }
 const pl=plStatement(invList,expList);
 // بهترین‌ها
 const qty={};
 for(const inv of invList)for(const it of inv.items)qty[it.name]=(qty[it.name]||0)+it.qty;
 const maxQ=Math.max(1,...Object.values(qty));
 c.innerHTML=`
 <div class="card p-3 mb-3">${monthFilterSel}
  <h3 class="font-bold mb-2">صورت سود و زیان ${repPeriod==='month'?'('+jmonthYear(now)+')':''}</h3>
  <table><tbody>
   <tr><td>درآمد فروش (بدون مالیات)</td><td class="text-emerald-400 font-bold">${fmoney(pl.revenue)}</td><td class="text-xs text-slate-400">${fmt(pl.invoiceCount)} فاکتور</td></tr>
   <tr><td>بهای تمام‌شده کالای فروش‌رفته (COGS)</td><td class="text-red-400 font-bold">(${fmoney(pl.cogs)})</td></tr>
   <tr><td class="font-bold">سود ناخالص</td><td class="font-bold text-emerald-400">${fmoney(pl.grossProfit)}</td><td class="text-xs text-slate-400">حاشیه ${PERCENT(pl.marginPct.toFixed(1))}</td></tr>
   <tr><td>هزینه‌های عملیاتی</td><td class="text-red-400 font-bold">(${fmoney(pl.opex)})</td></tr>
   <tr><td class="font-bold">سود (زیان) خالص قبل از مالیات</td><td class="font-bold ${pl.netProfit>=0?'text-emerald-400':'text-red-400'}">${fmoney(pl.netProfit)}</td></tr>
   <tr><td>مالیات عملکرد (${PERCENT(pl.taxRate)} از سود مشمول)</td><td class="text-amber-400 font-bold">(${fmoney(pl.incomeTax)})</td><td class="text-xs text-slate-400">سود مشمول: ${fmoney(pl.taxable)}</td></tr>
   <tr><td class="font-bold text-lg">سود خالص پس از مالیات</td><td class="font-bold text-lg ${pl.afterTax>=0?'text-pink-400':'text-red-400'}">${fmoney(pl.afterTax)}</td></tr>
  </tbody></table>
 </div>
 <div class="card p-3 mb-3"><h3 class="font-bold mb-2">مالیات ارزش افزوده (VAT)</h3>
  <table><tbody>
   <tr><td>مالیات دریافتی از فروش</td><td class="text-emerald-400">${fmoney(pl.vatCollected)}</td></tr>
   <tr><td>اعتبار مالیاتی خرید (تخمینی)</td><td class="text-sky-400">(${fmoney(pl.vatPaid)})</td></tr>
   <tr><td class="font-bold">بدهی ارزش افزوده قابل پرداخت</td><td class="font-bold text-amber-400">${fmoney(pl.vatPayable)}</td></tr>
  </tbody></table>
  <p class="text-xs text-slate-400 mt-2">مالیات ارزش افزوده درآمد محسوب نمی‌شود و جدا از سود و زیان گزارش می‌گردد.</p>
 </div>
 <div class="card p-3 mb-3"><h3 class="font-bold mb-2">محصولات پرفروش</h3>
  ${Object.entries(qty).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,q])=>`<div class="mb-1"><div class="flex justify-between text-xs"><span>${esc(n)}</span><span>${fmt(q)}</span></div><div class="bar" style="width:${q/maxQ*100}%"></div></div>`).join('')||'<p class="text-slate-400 text-sm">فروشی ثبت نشده</p>'}
 </div>
 <div class="card p-3 overflow-x-auto"><h3 class="font-bold mb-2">فاکتورها</h3>
  <table><thead><tr><th>شماره</th><th>تاریخ</th><th>فروشنده</th><th>کالا</th><th>مالیات</th><th>مبلغ کل</th><th>سود ناخالص</th></tr></thead><tbody>
  ${invList.slice().reverse().map(i=>`<tr><td>${fmt(i.id)}</td><td>${esc(i.jalali_date)}</td><td>${esc(i.seller_name)}</td><td>${fmoney(i.revenue??i.subtotal)}</td><td>${fmoney(i.vat)}</td><td>${fmoney(i.total)}</td><td class="text-emerald-400">${fmoney(i.gross_profit??i.profit)}</td></tr>`).join('')||'<tr><td colspan="7">—</td></tr>'}
  </tbody></table></div>`;
}
let repPeriod='all';
</script>
<script>
/* ================= هزینه‌های عملیاتی ================= */
function renderExpenses(){
 const c=document.getElementById('content');
 const list=expenses.slice().reverse();
 c.innerHTML=`
 <div class="card p-3 mb-3"><h3 class="font-bold mb-2">ثبت هزینه عملیاتی</h3>
  <div class="grid grid-cols-2 gap-2">
   <div><label class="text-xs">شرح</label><input id="exDesc" placeholder="اجاره، حقوق، برق و ..."></div>
   <div><label class="text-xs">مبلغ (تومان)</label><input id="exAmt" type="number" inputmode="numeric"></div>
  </div>
  <button class="btn btn-a w-full mt-2" onclick="addExpense()">افزودن هزینه</button>
 </div>
 <div class="card p-3 overflow-x-auto"><h3 class="font-bold mb-2">لیست هزینه‌ها — جمع: <span class="text-amber-400">${fmoney(expenses.reduce((s,e)=>s+(+e.amount||0),0))}</span></h3>
  <table><thead><tr><th>تاریخ</th><th>شرح</th><th>مبلغ</th><th></th></tr></thead><tbody>
  ${list.map(e=>{const ix=expenses.indexOf(e);return `<tr><td>${esc(e.jdate)}</td><td>${esc(e.desc)}</td><td class="text-red-400">${fmoney(e.amount)}</td><td><button class="btn btn-d text-xs" onclick="delExpense(${ix})">حذف</button></td></tr>`}).join('')||'<tr><td colspan="4">—</td></tr>'}
  </tbody></table></div>`;
}
function addExpense(){
 const d=document.getElementById('exDesc').value.trim(),a=+document.getElementById('exAmt').value||0;
 if(!d||a<=0){toast('شرح و مبلغ معتبر وارد کنید',false);return;}
 expenses.push({desc:d,amount:a,date:new Date().toISOString(),jdate:jdate(new Date())});
 lsSet(LS.e,expenses);toast('هزینه ثبت شد');renderExpenses();
}
function delExpense(i){expenses.splice(i,1);lsSet(LS.e,expenses);renderExpenses();}
</script>
<script>
/* ================= تنظیمات ================= */
function renderSettings(){
 const c=document.getElementById('content');
 const isAdmin = (user && user.username === 'admin');
 const logoSrc = (settings.store_logo || DEFAULT_LOGO);
 let storeSettingsHtml = '';
 if(isAdmin){
  storeSettingsHtml = `
 <div class="card p-3 mb-3">
  <h3 class="font-bold mb-2 flex items-center gap-2"><span>🏪</span>تنظیمات فروشگاه (فقط مدیر)</h3>
  <div class="space-y-3">
   <div>
    <label class="text-xs block mb-1">نام فروشگاه</label>
    <input id="stStoreName" class="w-full" value="${(settings.store_name || 'فروشگاه آسان').replace(/"/g, '&quot;')}">
   </div>
   <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
    <div>
     <label class="text-xs block mb-1">شماره تماس (اختیاری)</label>
     <input id="stStorePhone" class="w-full" placeholder="مثال: 09123456789" value="${(settings.store_phone || '').replace(/"/g, '&quot;')}">
    </div>
    <div>
     <label class="text-xs block mb-1">آدرس فروشگاه (اختیاری)</label>
     <input id="stStoreAddress" class="w-full" placeholder="مثال: خیابان اصلی، پلاک ۱۰" value="${(settings.store_address || '').replace(/"/g, '&quot;')}">
    </div>
   </div>
   <div class="pt-2 border-t border-slate-700">
    <label class="text-xs block mb-2 font-bold">لوگوی فروشگاه</label>
    <div class="flex items-center gap-4 flex-wrap">
     <div class="w-20 h-20 bg-slate-800 rounded-lg flex items-center justify-center p-2 border border-slate-700">
      <img id="stLogoPreview" src="${logoSrc}" alt="پیش‌نمایش لوگو" class="max-w-full max-h-full object-contain">
     </div>
     <div class="flex-1 min-w-[200px] flex flex-col gap-2">
      <label class="btn btn-s text-center cursor-pointer">
       <span>انتخاب تصویر لوگو جدید</span>
       <input type="file" id="stLogoInput" accept="image/*" class="hidden" onchange="previewCustomLogo(this)">
      </label>
      <button type="button" class="btn btn-d text-xs" onclick="resetStoreLogo()">بازنشانی به لوگوی پیش‌فرض</button>
     </div>
    </div>
   </div>
  </div>
  <button class="btn btn-p w-full mt-3" onclick="saveStoreSettings()">ذخیره مشخصات فروشگاه</button>
 </div>`;
 }

 const themeHtml = (user && user.username==='admin') ? `
 <div class="card p-3 mb-3"><h3 class="font-bold mb-2">ظاهر برنامه</h3>
  <div class="flex gap-2">
   <button class="btn flex-1 ${settings.theme!=='light'?'btn-p':'btn-s'}" onclick="setTheme('dark')">🌙 تیره</button>
   <button class="btn flex-1 ${settings.theme==='light'?'btn-p':'btn-s'}" onclick="setTheme('light')">☀️ روشن</button>
  </div>
  <p class="text-xs text-slate-400 mt-1">پیش‌فرض: تیره</p>
 </div>` : '';
 c.innerHTML= storeSettingsHtml + themeHtml + `
 <div class="card p-3 mb-3"><h3 class="font-bold mb-2">تنظیمات مالی</h3>
  <div class="grid grid-cols-2 gap-2">
   <div><label class="text-xs">نرخ مالیات عملکرد % (15 تا 20)</label>
    <input id="stTax" type="number" inputmode="numeric" min="0" max="100" value="${settings.income_tax_percent}"></div>
  </div>
  <button class="btn btn-p w-full mt-2" onclick="saveSettings()">ذخیره تنظیمات</button>
 </div>
 <div class="card p-3 mb-3"><h3 class="font-bold mb-2">پشتیبان‌گیری</h3>
  <button class="btn btn-g w-full" onclick="exportBackup()">دانلود فایل پشتیبان (JSON)</button>
  <p class="text-xs text-slate-400 mt-1">شامل محصولات، فاکتورها، هزینه‌ها و تنظیمات.</p></div>
 <div class="card p-3 mb-3"><h3 class="font-bold mb-2">بازیابی</h3>
  <label class="btn btn-a w-full block text-center">انتخاب فایل پشتیبان<input type="file" accept=".json" class="hidden" onchange="importBackup(this)"></label>
  <p class="text-xs text-slate-400 mt-2">با بازیابی، داده‌های فعلی جایگزین می‌شوند.</p></div>
 <div class="card p-3"><h3 class="font-bold mb-2 text-red-400">منطقه خطر</h3>
  <button class="btn btn-d w-full" onclick="resetAll()">پاک‌کردن همه داده‌ها</button></div>`;
}

let tempCustomLogo = null;
function previewCustomLogo(input){
 if(!input.files || !input.files[0]) return;
 const file = input.files[0];
 if(!file.type.startsWith('image/')){
  toast('لطفاً یک فایل تصویری انتخاب کنید', false);
  return;
 }
 const reader = new FileReader();
 reader.onload = function(e){
  tempCustomLogo = e.target.result;
  const prev = document.getElementById('stLogoPreview');
  if(prev) prev.src = tempCustomLogo;
  toast('تصویر بارگذاری شد، برای اعمال دکمه ذخیره را بزنید');
 };
 reader.readAsDataURL(file);
}

function resetStoreLogo(){
 tempCustomLogo = '';
 const prev = document.getElementById('stLogoPreview');
 if(prev) prev.src = DEFAULT_LOGO;
 toast('لوگو به حالت پیش‌فرض برگشت؛ دکمه ذخیره را بزنید');
}

function saveStoreSettings(){
 const nameInput = document.getElementById('stStoreName');
 if(!nameInput) return;
 const nameVal = nameInput.value.trim();
 if(!nameVal){
  toast('نام فروشگاه نمی‌تواند خالی باشد', false);
  return;
 }
 settings.store_name = nameVal;
 settings.store_phone = (document.getElementById('stStorePhone')?.value || '').trim();
 settings.store_address = (document.getElementById('stStoreAddress')?.value || '').trim();
 if(tempCustomLogo !== null){
  settings.store_logo = tempCustomLogo;
 }
 lsSet(LS.s, settings);
 applyStoreBranding();
 toast('تنظیمات فروشگاه با موفقیت ذخیره شد');
}

function saveSettings(){

 const t=+document.getElementById('stTax').value;
 if(isNaN(t)||t<0||t>100){toast('نرخ مالیات نامعتبر است',false);return;}
 settings.income_tax_percent=t;lsSet(LS.s,settings);toast('تنظیمات ذخیره شد');
}
function exportBackup(){
 const blob=new Blob([JSON.stringify({app:'cosmetics-pos',version:3,products,categories,invoices,expenses,settings,exported_at:new Date().toISOString(),jalali:jdate(new Date())},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='cosmetics-pos-backup-'+jdate(new Date()).replace(/[\/]/g,'-')+'.json';a.click();
 toast('پشتیبان دانلود شد');
}
function importBackup(input){
 if(!input.files||!input.files[0])return;
 const r=new FileReader();
 r.onload=()=>{try{
   const d=JSON.parse(r.result);
   if(!Array.isArray(d.products)||!Array.isArray(d.invoices))throw new Error('bad');
   products=migrateProducts(d.products);invoices=d.invoices;
   expenses=Array.isArray(d.expenses)?d.expenses:[];
   if(Array.isArray(d.categories)){categories=d.categories;lsSet(LS.c,categories);}
   if(d.settings){settings=Object.assign(settings,d.settings);applyStoreBranding();applyTheme();}
   lsSet(LS.p,products);lsSet(LS.i,invoices);lsSet(LS.e,expenses);lsSet(LS.s,settings);
   toast('بازیابی انجام شد');renderSettings();
 }catch(e){toast('فایل پشتیبان معتبر نیست',false);}};
 r.onerror=()=>toast('خواندن فایل ناموفق بود',false);
 r.readAsText(input.files[0]);
}
function resetAll(){
 if(!confirm('همه محصولات، فاکتورها و هزینه‌ها پاک شوند؟ این عمل قابل بازگشت نیست!'))return;
 if(!confirm('مطمئن هستید؟ ابتدا پشتیبان بگیرید.'))return;
 products=[];invoices=[];expenses=[];
 lsSet(LS.p,products);lsSet(LS.i,invoices);lsSet(LS.e,expenses);
 toast('داده‌ها پاک شد');renderTab();
}
</script>
<script>
/* ================= دسته محصولات (درختی، بی‌نهایت سطح) ================= */
function setTheme(t){settings.theme=t;lsSet(LS.s,settings);applyTheme();renderSettings();toast(t==='light'?'تم روشن فعال شد':'تم تیره فعال شد');}
function saveCats(){lsSet(LS.c,categories);}
function catById(id){return categories.find(c=>c.id===id);}
function catChildren(pid){return categories.filter(c=>(c.parent||null)===(pid||null)).sort((a,b)=>a.name.localeCompare(b.name,'fa'));}
function catPath(id){const parts=[];let c=catById(id),g=0;while(c&&g++<100){parts.unshift(c.name);c=catById(c.parent);}return parts.join(' › ');}
function catDescendants(id){let r=[];catChildren(id).forEach(c=>{r.push(c.id);r=r.concat(catDescendants(c.id));});return r;}
function catProductCount(id){const paths=[id,...catDescendants(id)].map(catPath);return products.filter(p=>paths.includes(p.category)||paths.some(x=>p.category&&p.category.startsWith(x+' › '))).length;}
function catTreeHtml(pid,depth){
 return catChildren(pid).map(c=>`<div class="cat-row" style="padding-right:${.5+depth*1.2}rem">
  <span class="nm">${depth?'↳ ':'📁 '}${esc(c.name)} <span class="text-xs text-slate-400">(${fmt(catProductCount(c.id))} کالا)</span></span>
  <button class="btn btn-g text-xs" style="min-height:32px;padding:.25rem .5rem" title="زیر‌دسته" onclick="addCat('${c.id}')">＋</button>
  <button class="btn btn-s text-xs" style="min-height:32px;padding:.25rem .5rem" title="ویرایش" onclick="renameCat('${c.id}')">✎</button>
  <button class="btn btn-d text-xs" style="min-height:32px;padding:.25rem .5rem" title="حذف" onclick="deleteCat('${c.id}')">🗑</button>
 </div>`+catTreeHtml(c.id,depth+1)).join('');
}
function renderCategories(){
 const c=document.getElementById('content');
 c.innerHTML=`<div class="card p-3 mb-3"><h3 class="font-bold mb-2">افزودن دسته اصلی</h3>
  <div class="flex gap-2"><input id="newCatName" placeholder="مثال: آرایشی و بهداشتی" onkeydown="if(event.key==='Enter')addCat(null,this.value)"><button class="btn btn-p" onclick="addCat(null,document.getElementById('newCatName').value)">افزودن</button></div>
  <p class="text-xs text-slate-400 mt-2">برای ساخت زیر‌دسته (مثلاً «رنگ مو» زیر «آرایشی و بهداشتی») روی دکمهٔ ＋ کنار دسته بزنید. تعداد سطح‌ها نامحدود است.</p></div>
 <div class="card p-2">${categories.length?catTreeHtml(null,0):'<p class="text-sm text-slate-400 p-2 text-center">هنوز دسته‌ای تعریف نشده است.</p>'}</div>`;
}
function addCat(parent,name){
 if(name==null){name=prompt('نام زیر‌دستهٔ «'+catPath(parent)+'»:');if(name==null)return;}
 name=String(name).trim().replace(/›/g,'-');if(!name){toast('نام دسته را وارد کنید',false);return;}
 if(catChildren(parent).some(c=>c.name===name)){toast('این دسته از قبل وجود دارد',false);return;}
 categories.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,parent:parent||null});
 saveCats();toast('دسته اضافه شد');renderCategories();
}
function renameCat(id){
 const c=catById(id);if(!c)return;
 let n=prompt('نام جدید دسته:',c.name);if(n==null)return;n=n.trim().replace(/›/g,'-');if(!n)return;
 if(catChildren(c.parent).some(x=>x.name===n&&x.id!==id)){toast('نام تکراری است',false);return;}
 const ids=[id,...catDescendants(id)],old={};ids.forEach(i=>old[i]=catPath(i));
 c.name=n;const map={};ids.forEach(i=>map[old[i]]=catPath(i));
 let ch=false;products.forEach(p=>{if(map[p.category]){p.category=map[p.category];ch=true;}});
 if(ch)lsSet(LS.p,products);saveCats();toast('ویرایش شد');renderCategories();
}
function deleteCat(id){
 const sub=catDescendants(id).length,cnt=catProductCount(id);
 if(!confirm('حذف «'+catPath(id)+'»'+(sub?' و '+fmt(sub)+' زیر‌دسته':'')+'؟'+(cnt?'\nدستهٔ '+fmt(cnt)+' کالا خالی می‌شود.':'')))return;
 const ids=[id,...catDescendants(id)],paths=ids.map(catPath);
 products.forEach(p=>{if(paths.includes(p.category))p.category='';});lsSet(LS.p,products);
 categories=categories.filter(c=>!ids.includes(c.id));saveCats();toast('حذف شد');renderCategories();
}
/* انتخابگر دسته در فرم محصول */
function openCatPicker(){
 const m=document.getElementById('catModal'),cur=(document.getElementById('pCat')||{}).value||'';
 const rows=(pid,d)=>catChildren(pid).map(c=>{const p=catPath(c.id);return `<button type="button" class="cat-pick ${p===cur?'sel':''}" style="padding-right:${.5+d*1.2}rem" onclick="pickCat('${c.id}')">${d?'↳ ':'📁 '}${esc(c.name)}</button>`+rows(c.id,d+1);}).join('');
 m.innerHTML=`<div class="modal-box"><div class="flex justify-between items-center mb-2"><b>انتخاب دسته</b><button class="btn btn-s" onclick="closeCatPicker()">✕</button></div>
  <input id="catSearch" placeholder="جستجوی دسته…" class="mb-2" oninput="filterCatPicker(this.value)">
  <div id="catList" style="overflow-y:auto;flex:1">${categories.length?rows(null,0):'<p class="text-sm text-slate-400 text-center p-3">هیچ دسته‌ای تعریف نشده.</p>'}</div>
  <div class="flex gap-2 mt-2"><button class="btn btn-s flex-1" onclick="pickCat(null)">بدون دسته</button>${canSee('categories')?'<button class="btn btn-g flex-1" onclick="closeCatPicker();setTab(\'categories\')">مدیریت دسته‌ها</button>':''}</div></div>`;
 m.classList.remove('hidden');
}
function filterCatPicker(q){q=q.trim();document.querySelectorAll('#catList .cat-pick').forEach(b=>{b.style.display=!q||b.textContent.includes(q)?'':'none';});}
function pickCat(id){const el=document.getElementById('pCat');if(el)el.value=id?catPath(id):'';closeCatPicker();}
function closeCatPicker(){const m=document.getElementById('catModal');m.classList.add('hidden');m.innerHTML='';}
</script>
