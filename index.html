<style>
/* ===== Embedded fallback stylesheet (works with NO CDN at all) ===== */
/* Layout */
.hidden{display:none!important}
.flex{display:flex}.grid{display:grid}
.items-center{align-items:center}.items-end{align-items:flex-end}
.justify-center{justify-content:center}.justify-between{justify-content:space-between}
.flex-1{flex:1 1 0%}.flex-wrap{flex-wrap:wrap}.block{display:block}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gap-1{gap:.25rem}.gap-2{gap:.5rem}
.min-h-screen{min-height:100vh}
.mx-auto{margin-left:auto;margin-right:auto}
.w-full{width:100%}
.max-w-sm{max-width:24rem}.max-w-3xl{max-width:48rem}
.min-w-\[110px\]{min-width:110px}.min-w-\[140px\]{min-width:140px}
.text-center{text-align:center}.text-right{text-align:right}
.overflow-x-auto{overflow-x:auto}
/* Spacing */
.p-2{padding:.5rem}.p-3{padding:.75rem}.p-4{padding:1rem}.p-6{padding:1.5rem}
.py-2{padding-top:.5rem;padding-bottom:.5rem}.pt-3{padding-top:.75rem}.pb-2{padding-bottom:.5rem}.pb-24{padding-bottom:6rem}
.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}
.mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
.my-2{margin-top:.5rem;margin-bottom:.5rem}
/* Typography */
.text-\[11px\]{font-size:11px}.text-xs{font-size:.75rem}.text-sm{font-size:.875rem}
.text-lg{font-size:1.125rem}.text-xl{font-size:1.25rem}.text-5xl{font-size:3rem;line-height:1}
.font-bold{font-weight:700}
/* High-contrast colors (brightened for legibility) */
.text-slate-300{color:#e2e8f0}.text-slate-400{color:#cbd5e1}.text-slate-500{color:#94a3b8}
.text-red-400{color:#f87171}.text-emerald-400{color:#34d399}.text-pink-400{color:#f472b6}
.text-amber-300{color:#fcd34d}.text-amber-400{color:#fbbf24}
.text-sky-400{color:#38bdf8}
.border-slate-600{border-color:#475569}.border-slate-700{border-color:#334155}
.border-b{border-bottom:1px solid #334155}.border-t{border-top:1px solid #334155}
/* Base look & feel (independent of Tailwind) */
html,body{margin:0;padding:0;background:#0f172a;color:#f1f5f9}
body{-webkit-text-size-adjust:100%}
input,select{box-sizing:border-box;outline:none}

<style>
*{font-family:Vazirmatn,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f172a;color:#e2e8f0}
.card{background:#1e293b;border:1px solid #334155;border-radius:1rem}
input,select{background:#0f172a;border:1px solid #334155;border-radius:.5rem;padding:.55rem;color:#e2e8f0;width:100%;font-size:16px}/*16px => جلوگیری از زوم در iOS/اندروید*/
.btn{border-radius:.6rem;padding:.55rem .9rem;font-weight:600;cursor:pointer;min-height:42px}
.btn-p{background:#ec4899;color:#fff}.btn-s{background:#334155;color:#e2e8f0}.btn-d{background:#7f1d1d;color:#fff}
.btn-g{background:#059669;color:#fff}.btn-a{background:#d97706;color:#fff}
table{width:100%;font-size:.85rem}th,td{padding:.4rem;border-bottom:1px solid #334155;text-align:right}
.low{background:#450a0a}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#ec4899,#8b5cf6)}
.tabbtn{padding:.5rem .8rem;border-radius:.6rem;font-size:.8rem;min-height:40px}
.tabbtn.active{background:#ec4899;color:#fff}
/* اسکنر به‌صورت مودال واقعی */
#scanModal{position:fixed;inset:0;background:rgba(2,6,23,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
#scanModal .box{background:#1e293b;border:1px solid #334155;border-radius:1rem;width:100%;max-width:420px;padding:1rem}
#reader{max-width:100%;border-radius:.5rem;overflow:hidden}
#reader video,#reader img,#reader canvas{width:100%!important;max-width:100%!important;max-height:260px;height:auto;object-fit:contain;border-radius:.5rem;background:#0f172a}
.toast{position:fixed;bottom:1rem;right:50%;transform:translateX(50%);background:#059669;color:#fff;padding:.6rem 1.2rem;border-radius:.75rem;z-index:60;font-weight:600}
.badge{font-size:.7rem;padding:.15rem .55rem;border-radius:999px}
.role-admin{background:#7c3aed}.role-seller{background:#0284c7}.role-acc{background:#d97706}
/* ===== تم روشن ===== */
body.light,html.light{background:#f8fafc!important;color:#0f172a!important}
body.light .card,body.light #scanModal .box,body.light .modal-box{background:#ffffff!important;border-color:#cbd5e1!important;color:#0f172a}
body.light input,body.light select,body.light textarea{background:#ffffff!important;border-color:#94a3b8!important;color:#0f172a!important}
body.light input::placeholder{color:#64748b}
body.light .btn-s{background:#e2e8f0!important;color:#0f172a!important}
body.light th,body.light td{border-color:#e2e8f0!important;color:#0f172a}
body.light .text-slate-300{color:#334155!important}body.light .text-slate-400{color:#475569!important}body.light .text-slate-500{color:#64748b!important}
body.light .text-red-400{color:#b91c1c!important}body.light .text-emerald-400{color:#047857!important}body.light .text-pink-400{color:#be185d!important}
body.light .text-amber-300,body.light .text-amber-400{color:#b45309!important}body.light .text-sky-400{color:#0369a1!important}
body.light .bg-slate-800{background:#f1f5f9!important}
body.light .border-slate-600,body.light .border-slate-700{border-color:#cbd5e1!important}
body.light .border-b{border-bottom-color:#e2e8f0!important}body.light .border-t{border-top-color:#e2e8f0!important}
body.light .low td,body.light .low{background:#fee2e2!important;color:#7f1d1d!important}
body.light #scanModal{background:rgba(15,23,42,.6)}
body.light #scanStatus{color:#0369a1!important}body.light #scanErr{color:#be123c!important}
body.light label{color:#1e293b}
/* درخت دسته‌ها */
.cat-row{display:flex;align-items:center;gap:.4rem;padding:.4rem .5rem;border-bottom:1px solid #334155}
body.light .cat-row{border-color:#e2e8f0}
.cat-row .nm{flex:1}
.cat-pick{display:block;width:100%;text-align:right;background:transparent;color:inherit;border:none;padding:.55rem .5rem;border-bottom:1px solid #334155;cursor:pointer;font-size:.95rem}
body.light .cat-pick{border-color:#e2e8f0}
.cat-pick.sel{background:#ec489933}
.exp-red{color:#f87171!important;font-weight:700}tr.exp-row td{background:rgba(239,68,68,.12)}
#invModal{position:fixed;inset:0;background:rgba(2,6,23,.9);z-index:60;overflow:auto;padding:.5rem}
#invModal .paper{background:#fff;color:#111;max-width:800px;margin:0 auto;padding:18px;border-radius:8px;direction:rtl;font-family:inherit}
@media print{body>*:not(#invModal){display:none!important}#invModal{position:static;background:#fff;padding:0;overflow:visible}.noprint{display:none!important}#invModal .paper{max-width:none;padding:0}@page{size:A4;margin:10mm}}
#catModal{position:fixed;inset:0;background:rgba(2,6,23,.85);z-index:55;display:flex;align-items:center;justify-content:center;padding:1rem}
#catModal .modal-box{background:#1e293b;border:1px solid #334155;border-radius:1rem;width:100%;max-width:420px;max-height:85vh;display:flex;flex-direction:column;padding:1rem}
</style>

const LS={p:'cpos_products',i:'cpos_invoices',e:'cpos_expenses',s:'cpos_settings',c:'cpos_categories',u:'cpos_customers',pl:'cpos_plans'};

function applyStoreBranding(){
 const name = (settings && settings.store_name) ? settings.store_name : 'فروشگاه آسان';
 const logo = (settings && settings.store_logo) ? settings.store_logo : DEFAULT_LOGO;
 const elLoginName = document.getElementById('loginStoreName');
 if(elLoginName) elLoginName.textContent = name;
 const elHeaderName = document.getElementById('headerStoreName');
 if(elHeaderName) elHeaderName.textContent = name;
 const elLoginLogo = document.getElementById('loginLogo');
 if(elLoginLogo) elLoginLogo.src = logo;
 const elHeaderLogo = document.getElementById('headerLogo');
 if(elHeaderLogo) elHeaderLogo.src = logo;
 document.title = name + ' — صندوق و حسابداری';
}

function lsGet(k,d){
 try{const raw=localStorage.getItem(k);if(raw==null)return d;const v=JSON.parse(raw);return v??d;}
 catch(e){console.error('localStorage read failed',k,e);return d;}
}
function lsSet(k,v){
 try{localStorage.setItem(k,JSON.stringify(v));return true;}
 catch(e){
  toast('⚠ خطا در ذخیره‌سازی! فضای مرورگر پر است یا دسترسی مسدود است');
  try{const bak={k:JSON.parse(localStorage.getItem(k))};/* keep old */}catch(_){}
  // پشتیبان درون‌حافظه‌ای تا پایان نشست
  window['mem_'+k]=v;return false;
 }
}
function toast(msg,ok=true){
 const t=document.createElement('div');t.className='toast'+(ok?'':' !bg-red-600');t.textContent=msg;
 document.getElementById('toastBox').appendChild(t);
 setTimeout(()=>t.remove(),2600);
}
const SEED=[
 ['6001001','شامپو ترمیم‌کننده','سی‌گنیفیک','شامپو',85000,120000,10,12],
 ['6001002','کرم دست نرم‌کننده','پارمیدا','کرم',40000,65000,10,8],
 ['6001003','رژ لب مات','نوت','آرایش',120000,175000,10,5],
 ['6001004','لاک ناخن','میکارون','آرایش',55000,90000,10,3],
 ['6001005','کرم ضدآفتاب SPF50','درماتیپیکس','ضدآفتاب',180000,245000,10,7],
 ['6001006','شامپوی بچه','بی‌بی','شامپو',60000,85000,10,4]
];
function migrateProducts(list){
 // سازگاری با نسخه‌های قبلی و اطمینان از فیلدهای مالی
 return (list||[]).map(p=>({
  barcode:String(p.barcode||''),name:p.name||'',brand:p.brand||'',category:p.category||'',
  purchase_price:+p.purchase_price||0,sale_price:+p.sale_price||0,
  vat_percent:(p.vat_percent==null?10:+p.vat_percent),stock:+p.stock||0,
  purchase_date:p.purchase_date||'',invoice_no:p.invoice_no||'',supplier:p.supplier||'',start_date:p.start_date||'',expiry_date:p.expiry_date||''
 }));
}
let products=migrateProducts(lsGet(LS.p,null));
if(!products||!products.length){products=migrateProducts(SEED.map(r=>({barcode:r[0],name:r[1],brand:r[2],category:r[3],purchase_price:r[4],sale_price:r[5],vat_percent:r[6],stock:r[7]})));lsSet(LS.p,products);}
let invoices=lsGet(LS.i,[]);if(!Array.isArray(invoices))invoices=[];
let expenses=lsGet(LS.e,[]);if(!Array.isArray(expenses))expenses=[];
let settings=Object.assign({income_tax_percent:15,operating_expense_monthly:0,store_name:'فروشگاه آسان',store_address:'',store_phone:'',store_logo:'',theme:'dark'},lsGet(LS.s,{}));
function applyTheme(){const l=settings.theme==='light';document.body.classList.toggle('light',l);document.documentElement.classList.toggle('light',l);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=l?'#f8fafc':'#0f172a';}
applyTheme();
/* دسته‌بندی درختی: {id,name,parent} */
let categories=lsGet(LS.c,null);
if(!Array.isArray(categories)){categories=[];const seen={};products.forEach(p=>{const n=(p.category||'').trim();if(n&&!seen[n]){seen[n]=1;categories.push({id:'c'+Date.now().toString(36)+categories.length,name:n,parent:null});}});lsSet(LS.c,categories);}
let cart=[], user=null;

const fmt=n=>Number(n||0).toLocaleString('fa-IR');
const fmoney=n=>fmt(Math.round(n))+' تومان';
/* تاریخ شمسی (جلالی) — تقویم واقعی fa-IR-u-ca-persian */
const jdate=d=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}catch(e){return new Date(d).toLocaleDateString('fa-IR');}};
const jdatetime=d=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d);}catch(e){return new Date(d).toLocaleString('fa-IR');}};
const jmonthYear=d=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long'}).format(d);}catch(e){return jdate(d);}};
document.getElementById('todayJ').textContent='📅 '+jdate(new Date());

async function runMultiPassDetection(src, onProgress) {

}

  video.srcObject = scanStream;
  try { await video.play(); } catch (e) {}
  setScanMsg('بارکد را داخل کادر سبز و روی خط قرمز نگه دارید...', '');
  scanLoop();
}

/* حلقهٔ اسکن زنده: BarcodeDetector → دیکودر داخلی → ZXing (هر چند فریم) */
let frameNo = 0, liveH5 = null;
async function scanLoop() {
  if (scanDone || !scanStream) return;
  const video = document.getElementById('scanVideo');
  if (!video) return;
  if (!scanBusy && video.videoWidth > 0) {
    scanBusy = true;
    try {
      frameNo++;
      const full = toCanvas(video, 1280);
      const roi = cropCanvas(full, 0.05, 0.25, 0.9, 0.5);
      let code = await bdDetect(roi) || await bdDetect(full);
      if (!code) code = jsDecodeCanvas(roi);
      if (!code && frameNo % 4 === 0 && typeof window.Html5Qrcode !== 'undefined') {
        try {
          if (!liveH5) liveH5 = new Html5Qrcode('reader-hidden-tmp', { formatsToSupport: h5Formats(), verbose: false });
          const blob = await canvasToBlob(roi);
          code = await liveH5.scanFile(new File([blob], 'f.jpg', { type: 'image/jpeg' }), false);
        } catch (e) { code = null; }
      }
      if (code && String(code).trim()) { onDecoded(String(code).trim()); return; }
    } catch (e) {} finally { scanBusy = false; }
  }
  scanLoopTimer = setTimeout(scanLoop, 120);
}

function stopCamera() {
  if (scanLoopTimer) { clearTimeout(scanLoopTimer); scanLoopTimer = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); scanStream = null; }
  if (liveH5) { try { liveH5.clear(); } catch (e) {} liveH5 = null; }
  scanBusy = false;
}

async function captureAndAnalyzeFrame() {
  const btn = document.getElementById('btnCaptureAnalyze');
  const video = document.getElementById('scanVideo');
  if (!video || !video.videoWidth) { setScanMsg('', 'دوربین آماده نیست؛ از «عکس با دوربین گوشی» یا گالری استفاده کنید.'); return; }
  if (btn) btn.disabled = true;
  try {
    const cv = toCanvas(video, 1920);
    setScanMsg('در حال تحلیل فریم...', '');
    const code = await runMultiPassDetection(cv, m => setScanMsg(m));
    if (code) onDecoded(code);
    else setScanMsg('', 'بارکد شناسایی نشد؛ نزدیک‌تر/واضح‌تر بگیرید یا دستی وارد کنید.');
  } catch (e) { setScanMsg('', 'خطا: ' + (e.message || e)); }
  finally { if (btn) btn.disabled = false; }
}

function loadImageFile(f) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f);
    const i = new Image();
    i.onload = () => { URL.revokeObjectURL(url); res(i); };
    i.onerror = () => { URL.revokeObjectURL(url); rej(new Error('فرمت تصویر پشتیبانی نمی‌شود (HEIC را به JPG تبدیل کنید)')); };
    i.src = url;
  });
}
async function scanFromFile(input) {
  const f = input.files && input.files[0];
  input.value = ''; // تا انتخاب دوبارهٔ همان فایل هم کار کند
  if (!f) return;
  setScanMsg('در حال باز کردن تصویر...', '');
  try {
    let src;
    if (window.createImageBitmap) { try { src = await createImageBitmap(f, { imageOrientation: 'from-image' }); } catch (e) { src = null; } }
    if (!src) src = await loadImageFile(f);
    const cv = toCanvas(src, 2000);
    if (!cv) throw new Error('تبدیل تصویر ناموفق بود');
    const code = await runMultiPassDetection(cv, m => setScanMsg(m));
    if (code) onDecoded(code);
    else setScanMsg('', 'بارکد در تصویر یافت نشد؛ عکس نزدیک‌تر و بدون تاری از خود بارکد بگیرید یا دستی وارد کنید.');
  } catch (e) { setScanMsg('', 'خطا در پردازش تصویر: ' + (e.message || e)); }
}

function submitManualBarcodeFromModal() {
  const inp = document.getElementById('manualBarcodeModalInput');
  const v = inp ? inp.value.trim() : '';
  if (!v) { setScanMsg('', 'لطفاً کد بارکد را وارد کنید.'); return; }
  onDecoded(v);
}
function onDecoded(txt) {
  if (scanDone) return;
  scanDone = true;
  txt = String(txt).trim().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
  const cb = scanCb;
  closeScanModal();
  if (cb) cb(txt);
}
function closeScanModal() {
  stopCamera();
  const m = document.getElementById('scanModal');
  if (m) { m.classList.add('hidden'); m.innerHTML = ''; }
}
function stopScan() { closeScanModal(); }
window.addEventListener('beforeunload', stopCamera);
document.addEventListener('visibilitychange', () => { if (document.hidden && scanStream) closeScanModal(); });
</script>

 const p=products.find(x=>x.barcode===code);if(!p)return;
 if(p.stock<=0){toast('موجودی کافی نیست',false);return;}
 const row=cart.find(x=>x.barcode===code);
 if(row){if(row.qty>=p.stock){toast('موجودی کافی نیست',false);return;}row.qty++;}
 else cart.push({barcode:code,qty:1});
 drawCart();
}
function setQty(code,val){
 const row=cart.find(x=>x.barcode===code),p=products.find(x=>x.barcode===code);if(!row)return;
 row.qty=Math.max(1,Math.min(p.stock,Math.round(+val||1)));drawCart();
}
function removeCart(code){cart=cart.filter(x=>x.barcode!==code);drawCart();}
/* محاسبات مالی درست:
   sale_price = قیمت فروش بدون مالیات. ماليات فروش جدا محاسبه و به مشتری اضافه می‌شود.
   سود ناخالص = (فروش − بهای تمام‌شده خرید) × تعداد   */
function cartMath(){
 let net=0,vat=0,profit=0;
 for(const row of cart){const p=products.find(x=>x.barcode===row.barcode);if(!p)continue;
  const line=p.sale_price*row.qty;
  net+=line;vat+=line*(p.vat_percent||0)/100;
  profit+=(p.sale_price-p.purchase_price)*row.qty;}
 const d=calcDiscount(net);const k=net>0?(net-d.total)/net:1;
 return {gross:net,net:net-d.total,disc:d.total,planDisc:d.plan,custDisc:d.cust,planObj:d.planObj,vat:vat*k,grand:(net-d.total)+vat*k,profit:profit-d.total};
}
function drawCart(){
 const rows=document.getElementById('cartRows');if(!rows)return;
 rows.innerHTML=cart.length?cart.map(r=>{const p=products.find(x=>x.barcode===r.barcode);if(!p)return '';return `<div class="flex items-center gap-2 py-2 border-b border-slate-700 flex-wrap">
 <div class="flex-1 min-w-[110px]"><b>${esc(p.name)}</b><div class="text-xs text-slate-400">${fmoney(p.sale_price)} ×</div></div>
 <input type="number" min="1" max="${p.stock}" value="${r.qty}" style="width:70px" onchange="setQty('${esc(p.barcode)}',this.value)" inputmode="numeric">
 <span>${fmoney(p.sale_price*r.qty)}</span><button class="text-red-400" onclick="removeCart('${esc(p.barcode)}')">✕</button></div>`}).join(''):'<p class="text-slate-400">سبد خالی است</p>';
 const m=cartMath();
 document.getElementById('cartTotals').innerHTML=
  `<div class="flex justify-between"><span>جمع کالا (بدون مالیات)</span><b>${fmoney(m.gross)}</b></div>
   ${m.disc?`<div class="flex justify-between text-emerald-400"><span>تخفیف${m.planObj?' ('+esc(m.planObj.name)+')':''}${m.custDisc?' + تخفیف مشتری':''}</span><b>− ${fmoney(m.disc)}</b></div>`:''}
   <div class="flex justify-between text-amber-300"><span>مالیات ارزش افزوده</span><b>${fmoney(m.vat)}</b></div>
   <div class="flex justify-between text-lg text-pink-400"><span>مبلغ قابل پرداخت</span><b>${fmoney(m.grand)}</b></div>`;
}
function checkout(){
 if(!cart.length){toast('سبد خرید خالی است',false);return;}
 for(const r of cart){const p=products.find(x=>x.barcode===r.barcode);if(!p||p.stock<r.qty){toast('موجودی برای '+(p?p.name:'محصول')+' کافی نیست',false);return;}}
 const m=cartMath();
 const items=cart.map(r=>{const p=products.find(x=>x.barcode===r.barcode);
  const line=p.sale_price*r.qty;
  return {barcode:p.barcode,name:p.name,brand:p.brand,category:p.category||'',qty:r.qty,purchase_price:p.purchase_price,sale_price:p.sale_price,vat_percent:p.vat_percent,
   line_total:line,disc:m.gross>0?m.disc*line/m.gross:0,vat:line*(p.vat_percent||0)/100*(m.gross>0?m.net/m.gross:1),cogs:p.purchase_price*r.qty,gross_profit:(p.sale_price-p.purchase_price)*r.qty-(m.gross>0?m.disc*line/m.gross:0)};});
 const cu=customers.find(x=>String(x.id)===String(posCustId));
 settings.inv_seq=(settings.inv_seq||0)+1;lsSet(LS.s,settings);
 const inv={id:Date.now(),no:'F-'+String(settings.inv_seq).padStart(6,'0'),customer_id:cu?cu.id:null,customer_name:cu?custFull(cu):'',customer_nid:cu?cu.national_id||'':'',plan_name:m.planObj?m.planObj.name:'',discount:m.disc,plan_discount:m.planDisc,cust_discount:m.custDisc,gross_total:m.gross,date:new Date().toISOString(),jalali_date:jdate(new Date()),
  seller:user.username,seller_name:user.role,pay_method:(document.getElementById('payMethod')||{}).value||'نقدی',items,
  revenue:m.net,cogs:items.reduce((s,i)=>s+i.cogs,0),
  gross_profit:m.profit,vat:m.vat,total:m.grand};
 for(const r of cart){const p=products.find(x=>x.barcode===r.barcode);p.stock-=r.qty;}
 invoices.push(inv);lsSet(LS.i,invoices);lsSet(LS.p,products);cart=[];drawCart();
 document.getElementById('receipt').innerHTML=`<div class="card p-4">
  <h3 class="font-bold mb-1">✅ فروش ثبت شد</h3>
  <p class="text-sm">فاکتور: ${fmt(inv.id)}</p><p class="text-sm">تاریخ: ${jdatetime(inv.date)}</p><p class="text-sm">فروشنده: ${esc(inv.seller_name)}</p>
  <p class="text-sm">مبلغ کالا: ${fmoney(inv.revenue)}</p><p class="text-sm text-amber-300">مالیات: ${fmoney(inv.vat)}</p>
  <b class="text-pink-400">مبلغ نهایی: ${fmoney(inv.total)}</b><button class="btn btn-p w-full mt-2" onclick="showInvoice(${inv.id})">🖨 نمایش / چاپ فاکتور</button></div>`;
 toast('فروش با موفقیت ثبت شد');
}
</script>
<script>
/* ورودی تاریخ شمسی: تایپ با کیبورد؛ مقدار (value) همچنان میلادی ISO است */
const JD={
 div:(a,b)=>~~(a/b),
 g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;const gy2=gm>2?gy+1:gy;
  let days=365*gy+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)-80+gd+g[gm-1];jy+=33*~~(days/12053);days%=12053;jy+=4*~~(days/1461);days%=1461;
  if(days>365){jy+=~~((days-1)/365);days=(days-1)%365;}const jm=days<186?1+~~(days/31):7+~~((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return [jy,jm,jd];},
 j2g(jy,jm,jd){let gy=jy<=979?621:1600;jy-=jy<=979?0:979;let days=365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:((jm-7)*30)+186);
  gy+=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++;}
  gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365;}
  let gd=days+1;const m=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;for(gm=1;gm<=12&&gd>m[gm];gm++)gd-=m[gm];return [gy,gm,gd];},
 norm:s=>String(s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632),
 toShow(iso){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(iso||'');if(!m)return '';const [y,mo,d]=JD.g2j(+m[1],+m[2],+m[3]);return y+'/'+String(mo).padStart(2,'0')+'/'+String(d).padStart(2,'0');},
 toIso(txt){const t=JD.norm(txt).trim();if(!t)return '';const m=/^(\d{4})\D?(\d{1,2})\D?(\d{1,2})$/.exec(t.replace(/\D+/g,'/'))||/^(\d{4})(\d\d)(\d\d)$/.exec(t);if(!m)return '';
  let y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31||(mo>6&&d>30))return '';if(y>=1700){return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
  const g=JD.j2g(y,mo,d);return g[0]+'-'+String(g[1]).padStart(2,'0')+'-'+String(g[2]).padStart(2,'0');}
};
function enhanceDates(root){(root||document).querySelectorAll('input[data-jd]:not([data-jdok])').forEach(el=>{
 el.dataset.jdok='1';const init=el.getAttribute('value');if(init)el.value=JD.toShow(init);
 const desc=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
 Object.defineProperty(el,'value',{get(){return JD.toIso(desc.get.call(el));},set(v){desc.set.call(el,/^\d{4}-/.test(v||'')?JD.toShow(v):(v||''));},configurable:true});
 el.addEventListener('blur',()=>{const raw=desc.get.call(el);if(!raw)return;const iso=JD.toIso(raw);if(iso){desc.set.call(el,JD.toShow(iso));}else{desc.set.call(el,'');toast('تاریخ نامعتبر؛ مثال: 1405/07/25',false);}});
 el.addEventListener('input',()=>{});});}
new MutationObserver(()=>enhanceDates()).observe(document.documentElement,{childList:true,subtree:true});
document.addEventListener('DOMContentLoaded',()=>enhanceDates());
</script>
<script>
/* ================= مشتریان، طرح‌های فروش، فاکتور چاپی ================= */
let customers=lsGet(LS.u,[]);
let plans=lsGet(LS.pl,[]);
let posCustId='';
let tempSeal=null;
const custFull=u=>u?(u.name+(u.mobile?' - '+u.mobile:'')):'';
const custName=i=>i.customer_name||'مشتری حضوری';
const invNo=i=>i.no||('#'+i.id);
const isAdmin=()=>!!(user&&user.username==='admin');
let retOrig=null, editInvId=null;
const NEG_KEYS=['line_total','disc','vat','cogs','gross_profit'];
function loadReturn(){
 const q=(document.getElementById('retNo').value||'').trim().toUpperCase();
 const inv=invoices.slice().reverse().find(i=>!i.is_return&&(invNo(i).toUpperCase()===q||String(i.id)===q));
 if(!inv){toast('فاکتوری با این شماره یافت نشد',false);retOrig=null;document.getElementById('retBody').innerHTML='';return;}
 retOrig=inv;
 document.getElementById('retBody').innerHTML=`<div class="text-sm mb-2">فاکتور <b>${esc(invNo(inv))}</b> — ${esc(custName(inv))} — ${jdate(new Date(inv.date))}</div>
 <table><thead><tr><th>کالا</th><th>خریداری‌شده</th><th>قابل مرجوعی</th><th>تعداد مرجوعی</th></tr></thead><tbody>
 ${inv.items.map((it,k)=>{const left=it.qty-((inv.returned||{})[it.barcode]||0);return `<tr><td>${esc(it.name)}</td><td>${fmt(it.qty)}</td><td>${fmt(left)}</td><td><input type="number" id="retQ${k}" min="0" max="${left}" value="0" ${left<=0?'disabled':''} style="width:80px"></td></tr>`}).join('')}
 </tbody></table>
 <input id="retReason" placeholder="دلیل مرجوعی (اختیاری)" class="mt-2">
 <button class="btn btn-p w-full mt-2" onclick="saveReturn()">ثبت مرجوعی</button>`;
}
function saveReturn(){
 const inv=retOrig; if(!inv){toast('ابتدا فاکتور را بارگذاری کنید',false);return;}
 const items=[];
 for(let k=0;k<inv.items.length;k++){
  const it=inv.items[k];
  const left=it.qty-((inv.returned||{})[it.barcode]||0);
  const q=parseInt(document.getElementById('retQ'+k).value)||0;
  if(q<0||q>left){toast('تعداد مرجوعی «'+it.name+'» نامعتبر است',false);return;}
  if(!q)continue;
  const ratio=q/it.qty, ni={...it,qty:-q};
  for(const key of NEG_KEYS) if(typeof it[key]==='number') ni[key]=-it[key]*ratio;
  items.push(ni);
 }
 if(!items.length){toast('تعداد مرجوعی را وارد کنید',false);return;}
 const sum=f=>items.reduce((a,x)=>a+f(x),0);
 const rev=sum(x=>(x.line_total||0)-(x.disc||0));
 const vat=sum(x=>x.vat||0);
 const ret={id:Date.now(),no:'R-'+String(Date.now()).slice(-8),is_return:true,ref_no:invNo(inv),ref_id:inv.id,
  reason:(document.getElementById('retReason')||{}).value||'',
  customer_id:inv.customer_id,customer_name:inv.customer_name,customer_nid:inv.customer_nid,plan_name:inv.plan_name,
  discount:sum(x=>x.disc||0),gross_total:sum(x=>x.line_total||0),date:new Date().toISOString(),jalali_date:jdate(new Date()),
  seller:user.username,seller_name:user.role,pay_method:inv.pay_method,items,
  revenue:rev,cogs:sum(x=>x.cogs||0),gross_profit:sum(x=>x.gross_profit||0),vat:vat,total:rev+vat};
 inv.returned=inv.returned||{};
 for(const x of items){
  const p=products.find(y=>y.barcode===x.barcode); if(p) p.stock-=x.qty; // qty negative => stock increases
  inv.returned[x.barcode]=(inv.returned[x.barcode]||0)-x.qty;
 }
 invoices.push(ret);lsSet(LS.i,invoices);lsSet(LS.p,products);
 toast('مرجوعی ثبت شد: '+ret.no);
 retOrig=null;renderPOS();
 setTimeout(()=>{const b=document.getElementById('receipt');if(b)b.innerHTML='';},0);
}
function delInv(id){
 if(!isAdmin()){toast('فقط مدیر می‌تواند فاکتور را حذف کند',false);return;}
 const inv=invoices.find(i=>i.id===id); if(!inv)return;
 if(!inv.is_return && invoices.some(x=>x.is_return&&x.ref_id===inv.id)){toast('ابتدا مرجوعی‌های این فاکتور را حذف کنید',false);return;}
 if(!confirm('فاکتور '+invNo(inv)+' حذف شود؟ موجودی کالاها اصلاح می‌شود.'))return;
 for(const it of inv.items||[]){const p=products.find(x=>x.barcode===it.barcode); if(p) p.stock+=it.qty;}
 if(inv.is_return){const o=invoices.find(x=>x.id===inv.ref_id); if(o&&o.returned) for(const it of inv.items) o.returned[it.barcode]=(o.returned[it.barcode]||0)+it.qty;}
 invoices=invoices.filter(i=>i.id!==id);
 lsSet(LS.i,invoices);lsSet(LS.p,products);editInvId=null;toast('فاکتور حذف شد');renderSalesReport();
}

 <label class="text-xs">نوع پرداخت</label><select id="eiPay">${pays.map(x=>`<option ${x===(inv.pay_method||'نقدی')?'selected':''}>${x}</option>`).join('')}</select>
 <label class="text-xs mt-2 block">مشتری</label><select id="eiCust"><option value="">مشتری حضوری</option>${customers.map(u=>`<option value="${u.id}" ${String(u.id)===String(inv.customer_id)?'selected':''}>${esc(custFull(u))}</option>`).join('')}</select>
 <div class="flex gap-2 mt-3"><button class="btn btn-p" onclick="saveInvEdit()">ذخیره</button><button class="btn btn-s" onclick="editInvId=null;renderSalesReport()">انصراف</button></div>
 <p class="text-xs text-slate-400 mt-2">اقلام و تعداد فاکتور قابل ویرایش نیست؛ برای اصلاح تعداد از بخش مرجوعی استفاده کنید.</p></div>`;
}
const daysTo=d=>Math.ceil((new Date(d+'T00:00:00')-new Date())/864e5);
const expState=p=>{if(!p.expiry_date)return '';const d=daysTo(p.expiry_date);return d<0?'expired':(d<=92?'soon':'ok');};
function expCell(p){const s=expState(p);if(!p.expiry_date)return '—';
 return `<span class="${s==='ok'?'':'exp-red'}">${jdate(new Date(p.expiry_date+'T00:00:00'))}${s==='expired'?' (منقضی)':''}</span>`;}
function invExtraOk(p){
 if(invF.sup&&p.supplier!==invF.sup)return false;
 if(invF.pinv&&!(p.invoice_no||'').includes(invF.pinv))return false;
 if(invF.pfrom&&(!p.purchase_date||p.purchase_date<invF.pfrom))return false;
 if(invF.pto&&(!p.purchase_date||p.purchase_date>invF.pto))return false;
 if(invF.exp==='soon'&&!['soon','expired'].includes(expState(p)))return false;
 if(invF.exp==='expired'&&expState(p)!=='expired')return false;
 if(invF.exp==='has'&&!p.expiry_date)return false;
 return true;}
/* ---- تخفیف ---- */
function planActive(pl,t){const d=new Date(t).toISOString().slice(0,10);return pl.active!==false&&(!pl.from||pl.from<=d)&&(!pl.to||pl.to>=d);}
function planValue(pl,base){return Math.min(base,base*(+pl.percent||0)/100+(+pl.fixed||0));}
function calcDiscount(base){
 let best=null,bv=0;
 for(const pl of plans){if(!planActive(pl,Date.now()))continue;const v=planValue(pl,base);if(v>bv){bv=v;best=pl;}}
 const cu=customers.find(x=>String(x.id)===String(posCustId));
 const cd=cu&&cu.discount?(base-bv)*(+cu.discount)/100:0;
 return {plan:Math.round(bv),cust:Math.round(cd),total:Math.round(bv+cd),planObj:best};}
function posCustOptions(){return `<option value="">مشتری حضوری (بدون ثبت)</option>`+customers.map(u=>`<option value="${u.id}" ${String(u.id)===String(posCustId)?'selected':''}>${esc(custFull(u))}</option>`).join('');}
function posCustChange(v){posCustId=v;const u=customers.find(x=>String(x.id)===String(v));
 const w=document.getElementById('custWarn');
 if(w){const msg=[];if(u){if(u.discount)msg.push(`تخفیف اختصاصی این مشتری: ${u.discount}٪`);
  if(u.type==='legal'&&(!u.national_id||!u.reg_no))msg.push('⚠️ مشتری حقوقی: شناسهٔ ملی/شمارهٔ ثبت ناقص است');
  if(u.type==='real'&&!u.national_id)msg.push('⚠️ کد ملی مشتری ثبت نشده است');}
  w.innerHTML=msg.map(x=>`<p class="text-xs text-amber-300 mt-1">${x}</p>`).join('');}
 if(typeof drawCart==='function')drawCart();}

 document.getElementById('content').innerHTML=`<div class="card p-4"><h2 class="font-bold mb-3">👥 مشتریان</h2>
 ${ro?'':`<div class="grid grid-cols-2 gap-2">

 <div class="overflow-x-auto mt-3"><table><thead><tr><th>نام</th><th>موبایل</th><th>نوع</th><th>کد ملی</th><th>تخفیف</th><th></th></tr></thead><tbody>
 ${customers.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.mobile||'')}</td><td>${u.type==='legal'?'حقوقی':'حقیقی'}</td><td>${esc(u.national_id||'')}</td><td>${u.discount||0}٪</td><td>${ro?'':`<button class="btn btn-s text-xs" onclick="editCustomer(${u.id})">ویرایش</button> <button class="btn btn-d text-xs" onclick="delCustomer(${u.id})">حذف</button>`}</td></tr>`).join('')||'<tr><td colspan=6>مشتری ثبت نشده</td></tr>'}

/* ---- عدد به حروف ---- */
function numWords(n){n=Math.round(n);if(n===0)return 'صفر';
 const o=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
 const t=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
 const h=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
 const three=x=>{const p=[];if(x>=100)p.push(h[Math.floor(x/100)]);x%=100;if(x>=20){p.push(t[Math.floor(x/10)]);if(x%10)p.push(o[x%10]);}else if(x)p.push(o[x]);return p.join(' و ');};
 const sc=['','هزار','میلیون','میلیارد','تریلیون'];const parts=[];let i=0;
 while(n>0){const c=n%1000;if(c)parts.unshift(three(c)+(sc[i]?' '+sc[i]:''));n=Math.floor(n/1000);i++;}
 return parts.join(' و ');}

  <table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="${th}">ردیف</th><th style="${th}">بارکد</th><th style="${th}">نام کالا</th><th style="${th}">تعداد</th><th style="${th}">قیمت واحد</th><th style="${th}">جمع</th></tr></thead><tbody>${rows}</tbody></table>
  <div style="margin-top:10px;max-width:320px;margin-right:auto;font-size:13px">${row('جمع کالا',fmoney(inv.gross_total||inv.revenue))}${inv.discount?row('تخفیف'+(inv.plan_name?' ('+esc(inv.plan_name)+')':''),'− '+fmoney(inv.discount)):''}${row('مالیات',fmoney(inv.vat))}${row('مبلغ نهایی',fmoney(inv.total),'border-top:1px solid #111;font-size:15px')}</div>
  <div style="margin-top:6px;font-size:13px">مبلغ به حروف: <b>${numWords(inv.total)} تومان</b></div>

async function shareInvoice(id){
 const inv=invoices.find(x=>x.id===id);const paper=document.getElementById('invPaper');
 const text=`فاکتور ${invNo(inv)} - ${settings.store_name||''}\nمبلغ: ${fmoney(inv.total)}`;
 try{
  const w=paper.offsetWidth,h=paper.offsetHeight,c=paper.cloneNode(true);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="direction:rtl;font-family:sans-serif;background:#fff;color:#111;padding:18px;box-sizing:border-box;width:${w}px">${new XMLSerializer().serializeToString(c).replace(/^<div[^>]*>/,'').replace(/<\/div>$/,'')}</div></foreignObject></svg>`;
  const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
  const cv=document.createElement('canvas');cv.width=w*2;cv.height=h*2;const x=cv.getContext('2d');x.scale(2,2);x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0);
  const blob=await new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(),'image/png'));
  const file=new File([blob],'invoice-'+invNo(inv)+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();toast('تصویر فاکتور دانلود شد');
 }catch(e){
  if(e&&e.name==='AbortError')return;
  if(navigator.share){try{await navigator.share({text});return;}catch(_){}}
  toast('اشتراک تصویر ممکن نشد؛ از «چاپ / PDF» استفاده کنید',false);}
}

<script>
/* ================= حسابداری: سود و زیان، ارزش افزوده، مالیات عملکرد ================= */
const PERCENT=n=>fmt(n)+'٪';
function plStatement(invList,expList){
 // درآمد = فروش بدون مالیات (مالیات ارزش افزوده بر عهده مشتری و بدهی به سازمان امور مالیاتی است)
 const revenue=invList.reduce((s,i)=>s+(i.revenue??i.subtotal??0),0);
 const cogs=invList.reduce((s,i)=>s+(i.cogs??i.items.reduce((x,it)=>x+(it.cogs??(it.purchase_price||0)*(it.qty||0)),0)),0);
 const grossProfit=revenue-cogs;
 const vatCollected=invList.reduce((s,i)=>s+(i.vat||0),0);
 // مالیات خرید ورودی (credit) تقریبی: 10٪ بهای تمام‌شده اقلام با vat_percent>0
 const vatPaid=invList.reduce((s,i)=>s+i.items.reduce((x,it)=>x+((it.vat_percent||0)>0?(it.cogs??(it.purchase_price||0)*(it.qty||0))*0.10:0),0),0);
 const vatPayable=Math.max(0,vatCollected-vatPaid);
 const opex=expList.reduce((s,e)=>s+(+e.amount||0),0);
 const netProfit=grossProfit-opex;
 const taxRate=(+settings.income_tax_percent||0)/100;
 // ماليات عملکرد: بر سود مشمول (سود خالص مثبت) — نرخ قابل تنظیم (پیش‌فرض 15٪)
 const taxable=Math.max(0,netProfit);
 const incomeTax=taxable*taxRate;
 const afterTax=netProfit-incomeTax;
 return {revenue,cogs,grossProfit,vatCollected,vatPaid,vatPayable,opex,netProfit,taxRate:taxRate*100,taxable,incomeTax,afterTax,
  invoiceCount:invList.length,marginPct:revenue>0?grossProfit/revenue*100:0};
}
function renderReports(){
 const c=document.getElementById('content');
 const monthFilterSel=`<select id="repPeriod" class="mb-3" onchange="renderReports()">
  <option value="all">کل دوره</option>
  <option value="month" ${repPeriod==='month'?'selected':''}>ماه جاری (شمسی)</option>
  <option value="week" ${repPeriod==='week'?'selected':''}>۷ روز اخیر</option>
 </select>`;
 let invList=invoices,expList=expenses;
 const now=new Date();
 if(repPeriod==='month'){
  // ماه شمسی جاری: فیلتر با رشته تاریخ شمسی سال/ماه
  const mp=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit'}).format(now);
  invList=invoices.filter(i=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit'}).format(new Date(i.date))===mp}catch(e){return false}});
  expList=expenses.filter(e=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit'}).format(new Date(e.date))===mp}catch(e){return false}});
 } else if(repPeriod==='week'){
  const cut=now.getTime()-7*24*3600*1000;
  invList=invoices.filter(i=>new Date(i.date).getTime()>=cut);
  expList=expenses.filter(e=>new Date(e.date).getTime()>=cut);
 }
 const pl=plStatement(invList,expList);
 // بهترین‌ها
 const qty={};
 for(const inv of invList)for(const it of inv.items)qty[it.name]=(qty[it.name]||0)+it.qty;
 const maxQ=Math.max(1,...Object.values(qty));
 c.innerHTML=`
 <div class="card p-3 mb-3">${monthFilterSel}
  <h3 class="font-bold mb-2">صورت سود و زیان ${repPeriod==='month'?'('+jmonthYear(now)+')':''}</h3>
  <table><tbody>
   <tr><td>درآمد فروش (بدون مالیات)</td><td class="text-emerald-400 font-bold">${fmoney(pl.revenue)}</td><td class="text-xs text-slate-400">${fmt(pl.invoiceCount)} فاکتور</td></tr>
   <tr><td>بهای تمام‌شده کالای فروش‌رفته (COGS)</td><td class="text-red-400 font-bold">(${fmoney(pl.cogs)})</td></tr>
   <tr><td class="font-bold">سود ناخالص</td><td class="font-bold text-emerald-400">${fmoney(pl.grossProfit)}</td><td class="text-xs text-slate-400">حاشیه ${PERCENT(pl.marginPct.toFixed(1))}</td></tr>
   <tr><td>هزینه‌های عملیاتی</td><td class="text-red-400 font-bold">(${fmoney(pl.opex)})</td></tr>
   <tr><td class="font-bold">سود (زیان) خالص قبل از مالیات</td><td class="font-bold ${pl.netProfit>=0?'text-emerald-400':'text-red-400'}">${fmoney(pl.netProfit)}</td></tr>
   <tr><td>مالیات عملکرد (${PERCENT(pl.taxRate)} از سود مشمول)</td><td class="text-amber-400 font-bold">(${fmoney(pl.incomeTax)})</td><td class="text-xs text-slate-400">سود مشمول: ${fmoney(pl.taxable)}</td></tr>
   <tr><td class="font-bold text-lg">سود خالص پس از مالیات</td><td class="font-bold text-lg ${pl.afterTax>=0?'text-pink-400':'text-red-400'}">${fmoney(pl.afterTax)}</td></tr>
  </tbody></table>
 </div>
 <div class="card p-3 mb-3"><h3 class="font-bold mb-2">مالیات ارزش افزوده (VAT)</h3>
  <table><tbody>
   <tr><td>مالیات دریافتی از فروش</td><td class="text-emerald-400">${fmoney(pl.vatCollected)}</td></tr>
   <tr><td>اعتبار مالیاتی خرید (تخمینی)</td><td class="text-sky-400">(${fmoney(pl.vatPaid)})</td></tr>
   <tr><td class="font-bold">بدهی ارزش افزوده قابل پرداخت</td><td class="font-bold text-amber-400">${fmoney(pl.vatPayable)}</td></tr>
  </tbody></table>
  <p class="text-xs text-slate-400 mt-2">مالیات ارزش افزوده درآمد محسوب نمی‌شود و جدا از سود و زیان گزارش می‌گردد.</p>
 </div>
 <div class="card p-3 mb-3"><h3 class="font-bold mb-2">محصولات پرفروش</h3>
  ${Object.entries(qty).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,q])=>`<div class="mb-1"><div class="flex justify-between text-xs"><span>${esc(n)}</span><span>${fmt(q)}</span></div><div class="bar" style="width:${q/maxQ*100}%"></div></div>`).join('')||'<p class="text-slate-400 text-sm">فروشی ثبت نشده</p>'}
 </div>
 <div class="card p-3 overflow-x-auto"><h3 class="font-bold mb-2">فاکتورها</h3>
  <table><thead><tr><th>شماره</th><th>تاریخ</th><th>فروشنده</th><th>کالا</th><th>مالیات</th><th>مبلغ کل</th><th>سود ناخالص</th></tr></thead><tbody>
  ${invList.slice().reverse().map(i=>`<tr><td>${fmt(i.id)}</td><td>${esc(i.jalali_date)}</td><td>${esc(i.seller_name)}</td><td>${fmoney(i.revenue??i.subtotal)}</td><td>${fmoney(i.vat)}</td><td>${fmoney(i.total)}</td><td class="text-emerald-400">${fmoney(i.gross_profit??i.profit)}</td></tr>`).join('')||'<tr><td colspan="7">—</td></tr>'}
  </tbody></table></div>`;
}
let repPeriod='all';
</script>

let tempCustomLogo = null;
function previewCustomLogo(input){
 if(!input.files || !input.files[0]) return;
 const file = input.files[0];
 if(!file.type.startsWith('image/')){
  toast('لطفاً یک فایل تصویری انتخاب کنید', false);
  return;
 }
 const reader = new FileReader();
 reader.onload = function(e){
  tempCustomLogo = e.target.result;
  const prev = document.getElementById('stLogoPreview');
  if(prev) prev.src = tempCustomLogo;
  toast('تصویر بارگذاری شد، برای اعمال دکمه ذخیره را بزنید');
 };
 reader.readAsDataURL(file);
}

function resetStoreLogo(){
 tempCustomLogo = '';
 const prev = document.getElementById('stLogoPreview');
 if(prev) prev.src = DEFAULT_LOGO;
 toast('لوگو به حالت پیش‌فرض برگشت؛ دکمه ذخیره را بزنید');
}

function saveStoreSettings(){
 const nameInput = document.getElementById('stStoreName');
 if(!nameInput) return;
 const nameVal = nameInput.value.trim();
 if(!nameVal){
  toast('نام فروشگاه نمی‌تواند خالی باشد', false);
  return;
 }
 settings.store_name = nameVal;
 settings.store_phone = (document.getElementById('stStorePhone')?.value || '').trim();
 settings.store_address = (document.getElementById('stStoreAddress')?.value || '').trim();
 if(tempCustomLogo !== null){
  settings.store_logo = tempCustomLogo;
 }
 if(tempSeal !== null) settings.store_seal = tempSeal;
 lsSet(LS.s, settings);
 applyStoreBranding();
 toast('تنظیمات فروشگاه با موفقیت ذخیره شد');
}

function saveSettings(){

 const t=+document.getElementById('stTax').value;
 if(isNaN(t)||t<0||t>100){toast('نرخ مالیات نامعتبر است',false);return;}
 settings.income_tax_percent=t;lsSet(LS.s,settings);toast('تنظیمات ذخیره شد');
}
function exportBackup(){
 const blob=new Blob([JSON.stringify({app:'cosmetics-pos',version:4,products,categories,customers,plans,invoices,expenses,settings,exported_at:new Date().toISOString(),jalali:jdate(new Date())},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='cosmetics-pos-backup-'+jdate(new Date()).replace(/[\/]/g,'-')+'.json';a.click();
 toast('پشتیبان دانلود شد');
}
function importBackup(input){
 if(!input.files||!input.files[0])return;
 const r=new FileReader();
 r.onload=()=>{try{
   const d=JSON.parse(r.result);
   if(!Array.isArray(d.products)||!Array.isArray(d.invoices))throw new Error('bad');
   products=migrateProducts(d.products);invoices=d.invoices;
   expenses=Array.isArray(d.expenses)?d.expenses:[];
   if(Array.isArray(d.customers)){customers=d.customers;lsSet(LS.u,customers);}
   if(Array.isArray(d.plans)){plans=d.plans;lsSet(LS.pl,plans);}
   if(Array.isArray(d.categories)){categories=d.categories;lsSet(LS.c,categories);}
   if(d.settings){settings=Object.assign(settings,d.settings);applyStoreBranding();applyTheme();}
   lsSet(LS.p,products);lsSet(LS.i,invoices);lsSet(LS.e,expenses);lsSet(LS.s,settings);
   toast('بازیابی انجام شد');renderSettings();
 }catch(e){toast('فایل پشتیبان معتبر نیست',false);}};
 r.onerror=()=>toast('خواندن فایل ناموفق بود',false);
 r.readAsText(input.files[0]);
}
function resetAll(){
 if(!confirm('همه محصولات، فاکتورها و هزینه‌ها پاک شوند؟ این عمل قابل بازگشت نیست!'))return;
 if(!confirm('مطمئن هستید؟ ابتدا پشتیبان بگیرید.'))return;
 products=[];invoices=[];expenses=[];customers=[];plans=[];lsSet(LS.u,customers);lsSet(LS.pl,plans);
 lsSet(LS.p,products);lsSet(LS.i,invoices);lsSet(LS.e,expenses);
 toast('داده‌ها پاک شد');renderTab();
}

<script>
/* ================= دسته محصولات (درختی، بی‌نهایت سطح) ================= */
function setTheme(t){settings.theme=t;lsSet(LS.s,settings);applyTheme();renderSettings();toast(t==='light'?'تم روشن فعال شد':'تم تیره فعال شد');}
function saveCats(){lsSet(LS.c,categories);}
function catById(id){return categories.find(c=>c.id===id);}
function catChildren(pid){return categories.filter(c=>(c.parent||null)===(pid||null)).sort((a,b)=>a.name.localeCompare(b.name,'fa'));}
function catPath(id){const parts=[];let c=catById(id),g=0;while(c&&g++<100){parts.unshift(c.name);c=catById(c.parent);}return parts.join(' › ');}
function catDescendants(id){let r=[];catChildren(id).forEach(c=>{r.push(c.id);r=r.concat(catDescendants(c.id));});return r;}
function catProductCount(id){const paths=[id,...catDescendants(id)].map(catPath);return products.filter(p=>paths.includes(p.category)||paths.some(x=>p.category&&p.category.startsWith(x+' › '))).length;}
function catTreeHtml(pid,depth){
 return catChildren(pid).map(c=>`<div class="cat-row" style="padding-right:${.5+depth*1.2}rem">
  <span class="nm">${depth?'↳ ':'📁 '}${esc(c.name)} <span class="text-xs text-slate-400">(${fmt(catProductCount(c.id))} کالا)</span></span>
  <button class="btn btn-g text-xs" style="min-height:32px;padding:.25rem .5rem" title="زیر‌دسته" onclick="addCat('${c.id}')">＋</button>
  <button class="btn btn-s text-xs" style="min-height:32px;padding:.25rem .5rem" title="ویرایش" onclick="renameCat('${c.id}')">✎</button>
  <button class="btn btn-d text-xs" style="min-height:32px;padding:.25rem .5rem" title="حذف" onclick="deleteCat('${c.id}')">🗑</button>
 </div>`+catTreeHtml(c.id,depth+1)).join('');
}
function renderCategories(){
 const c=document.getElementById('content');
 c.innerHTML=`<div class="card p-3 mb-3"><h3 class="font-bold mb-2">افزودن دسته اصلی</h3>
  <div class="flex gap-2"><input id="newCatName" placeholder="مثال: آرایشی و بهداشتی" onkeydown="if(event.key==='Enter')addCat(null,this.value)"><button class="btn btn-p" onclick="addCat(null,document.getElementById('newCatName').value)">افزودن</button></div>
  <p class="text-xs text-slate-400 mt-2">برای ساخت زیر‌دسته (مثلاً «رنگ مو» زیر «آرایشی و بهداشتی») روی دکمهٔ ＋ کنار دسته بزنید. تعداد سطح‌ها نامحدود است.</p></div>
 <div class="card p-2">${categories.length?catTreeHtml(null,0):'<p class="text-sm text-slate-400 p-2 text-center">هنوز دسته‌ای تعریف نشده است.</p>'}</div>`;
}
function addCat(parent,name){
 if(name==null){name=prompt('نام زیر‌دستهٔ «'+catPath(parent)+'»:');if(name==null)return;}
 name=String(name).trim().replace(/›/g,'-');if(!name){toast('نام دسته را وارد کنید',false);return;}
 if(catChildren(parent).some(c=>c.name===name)){toast('این دسته از قبل وجود دارد',false);return;}
 categories.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,parent:parent||null});
 saveCats();toast('دسته اضافه شد');renderCategories();
}
function renameCat(id){
 const c=catById(id);if(!c)return;
 let n=prompt('نام جدید دسته:',c.name);if(n==null)return;n=n.trim().replace(/›/g,'-');if(!n)return;
 if(catChildren(c.parent).some(x=>x.name===n&&x.id!==id)){toast('نام تکراری است',false);return;}
 const ids=[id,...catDescendants(id)],old={};ids.forEach(i=>old[i]=catPath(i));
 c.name=n;const map={};ids.forEach(i=>map[old[i]]=catPath(i));
 let ch=false;products.forEach(p=>{if(map[p.category]){p.category=map[p.category];ch=true;}});
 if(ch)lsSet(LS.p,products);saveCats();toast('ویرایش شد');renderCategories();
}
function deleteCat(id){
 const sub=catDescendants(id).length,cnt=catProductCount(id);
 if(!confirm('حذف «'+catPath(id)+'»'+(sub?' و '+fmt(sub)+' زیر‌دسته':'')+'؟'+(cnt?'\nدستهٔ '+fmt(cnt)+' کالا خالی می‌شود.':'')))return;
 const ids=[id,...catDescendants(id)],paths=ids.map(catPath);
 products.forEach(p=>{if(paths.includes(p.category))p.category='';});lsSet(LS.p,products);
 categories=categories.filter(c=>!ids.includes(c.id));saveCats();toast('حذف شد');renderCategories();
}
/* انتخابگر دسته در فرم محصول */
function openCatPicker(){
 const m=document.getElementById('catModal'),cur=(document.getElementById('pCat')||{}).value||'';
 const rows=(pid,d)=>catChildren(pid).map(c=>{const p=catPath(c.id);return `<button type="button" class="cat-pick ${p===cur?'sel':''}" style="padding-right:${.5+d*1.2}rem" onclick="pickCat('${c.id}')">${d?'↳ ':'📁 '}${esc(c.name)}</button>`+rows(c.id,d+1);}).join('');
 m.innerHTML=`<div class="modal-box"><div class="flex justify-between items-center mb-2"><b>انتخاب دسته</b><button class="btn btn-s" onclick="closeCatPicker()">✕</button></div>
  <input id="catSearch" placeholder="جستجوی دسته…" class="mb-2" oninput="filterCatPicker(this.value)">
  <div id="catList" style="overflow-y:auto;flex:1">${categories.length?rows(null,0):'<p class="text-sm text-slate-400 text-center p-3">هیچ دسته‌ای تعریف نشده.</p>'}</div>
  <div class="flex gap-2 mt-2"><button class="btn btn-s flex-1" onclick="pickCat(null)">بدون دسته</button>${canSee('categories')?'<button class="btn btn-g flex-1" onclick="closeCatPicker();setTab(\'categories\')">مدیریت دسته‌ها</button>':''}</div></div>`;
 m.classList.remove('hidden');
}
function filterCatPicker(q){q=q.trim();document.querySelectorAll('#catList .cat-pick').forEach(b=>{b.style.display=!q||b.textContent.includes(q)?'':'none';});}
function pickCat(id){const el=document.getElementById('pCat');if(el)el.value=id?catPath(id):'';closeCatPicker();}
function closeCatPicker(){const m=document.getElementById('catModal');m.classList.add('hidden');m.innerHTML='';}
</script>
<script>
/* ================= گزارش‌گیری فروش و سود و زیان ================= */
let rpF={period:'day',from:'',to:'',by:'product',cat:'',brand:'',pay:'',cust:'',plan:''};
function dayStart(d){d=new Date(d);d.setHours(0,0,0,0);return d;}
function rpRange(){
 const now=new Date();let from,to=new Date(now);to.setHours(23,59,59,999);
 if(rpF.period==='day')from=dayStart(now);
 else if(rpF.period==='week'){from=dayStart(now);from.setDate(from.getDate()-((from.getDay()+1)%7));} // شروع هفته: شنبه
 else if(rpF.period==='month'){// ماه شمسی جاری
  from=dayStart(now);const dd=()=>+new Intl.DateTimeFormat('en-u-ca-persian',{day:'numeric'}).format(from);let g=0;while(dd()>1&&g++<31)from.setDate(from.getDate()-1);}
 else {from=rpF.from?dayStart(rpF.from):dayStart(now);to=rpF.to?new Date(rpF.to):new Date(now);to.setHours(23,59,59,999);}
 return {from,to};
}
function itemCat(it){if(it.category)return it.category;const p=products.find(x=>x.barcode===it.barcode);return p?p.category||'':'';}
function itemBrand(it){if(it.brand)return it.brand;const p=products.find(x=>x.barcode===it.barcode);return p?p.brand||'':'';}
function setRp(k,v){rpF[k]=v;renderSalesReport();}
function renderSalesReport(){
 const c=document.getElementById('content');const {from,to}=rpRange();
 const invs=invoices.filter(i=>{const d=new Date(i.date);return d>=from&&d<=to&&(!rpF.pay||(i.pay_method||'نقدی')===rpF.pay)&&(!rpF.cust||String(i.customer_id||'')===rpF.cust)&&(!rpF.plan||(i.plan_name||'')===rpF.plan);});
 // اقلام فیلترشده
 const rows=[];invs.forEach(i=>(i.items||[]).forEach(it=>{const cat=itemCat(it),br=itemBrand(it);
  if(!catMatch(cat,rpF.cat))return;if(rpF.brand&&br!==rpF.brand)return;
  const rev=(it.line_total??(it.sale_price||0)*(it.qty||0))-(it.disc||0),cogs=it.cogs??(it.purchase_price||0)*(it.qty||0);
  rows.push({inv:i,cust:custName(i),plan:i.plan_name||'بدون طرح',name:it.name,barcode:it.barcode,cat:cat||'بدون دسته',brand:br||'بدون برند',pay:i.pay_method||'نقدی',qty:it.qty||0,rev,cogs,vat:it.vat||0,profit:rev-cogs});}));
 const tot=rows.reduce((a,r)=>{a.qty+=r.qty;a.rev+=r.rev;a.cogs+=r.cogs;a.vat+=r.vat;a.profit+=r.profit;return a;},{qty:0,rev:0,cogs:0,vat:0,profit:0});
 const filtered=rpF.cat||rpF.brand;
 const exp=filtered?0:expenses.filter(e=>{const d=new Date(e.date);return d>=from&&d<=to;}).reduce((s,e)=>s+(+e.amount||0),0);
 const net=tot.profit-exp;
 const keyOf={product:r=>r.name,category:r=>r.cat,brand:r=>r.brand,pay:r=>r.pay,customer:r=>r.cust,plan:r=>r.plan,day:r=>jdate(new Date(r.inv.date))};
 const grp={};rows.forEach(r=>{const k=keyOf[rpF.by](r);const g=grp[k]=grp[k]||{qty:0,rev:0,cogs:0,profit:0,inv:new Set()};g.qty+=r.qty;g.rev+=r.rev;g.cogs+=r.cogs;g.profit+=r.profit;g.inv.add(r.inv.id);});
 const byLbl={product:'محصول',category:'دسته',brand:'برند',pay:'نوع فروش',customer:'مشتری',plan:'طرح فروش',day:'روز'};
 const ent=Object.entries(grp).sort((a,b)=>rpF.by==='day'?0:b[1].rev-a[1].rev);
 const pays=[...new Set(['نقدی','کارتخوان','کارت به کارت','نسیه','آنلاین',...invoices.map(i=>i.pay_method||'نقدی')])];
 const pb=(k,l)=>`<button class="btn flex-1 ${rpF.period===k?'btn-p':'btn-s'}" onclick="setRp('period','${k}')">${l}</button>`;
 c.innerHTML=`<div class="card p-3 mb-3"><h3 class="font-bold mb-2">🧾 گزارش‌گیری فروش</h3>
  <div class="flex gap-2 mb-2">${pb('day','روزانه')}${pb('week','هفتگی')}${pb('month','ماهانه')}${pb('custom','بازه دلخواه')}</div>
  ${rpF.period==='custom'?`<div class="grid grid-cols-2 gap-2 mb-2"><div><label class="text-xs">از تاریخ</label><input type="text" data-jd inputmode="numeric" placeholder="شمسی 1405/07/25 یا میلادی 2026/10/17" autocomplete="off" value="${rpF.from}" onchange="setRp('from',this.value)"></div><div><label class="text-xs">تا تاریخ</label><input type="text" data-jd inputmode="numeric" placeholder="شمسی 1405/07/25 یا میلادی 2026/10/17" autocomplete="off" value="${rpF.to}" onchange="setRp('to',this.value)"></div></div>`:''}
  <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
   <div><label class="text-xs">گروه‌بندی بر اساس</label><select onchange="setRp('by',this.value)">${Object.entries(byLbl).map(([k,v])=>`<option value="${k}" ${rpF.by===k?'selected':''}>${v}</option>`).join('')}</select></div>
   <div><label class="text-xs">دسته / زیرگروه</label><select onchange="setRp('cat',this.value)">${catOptions(rpF.cat)}</select></div>
   <div><label class="text-xs">برند</label><select onchange="setRp('brand',this.value)">${brandOptions(rpF.brand)}</select></div>
   <div><label class="text-xs">نوع فروش</label><select onchange="setRp('pay',this.value)"><option value="">همه</option>${pays.map(p=>`<option ${p===rpF.pay?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
   <div><label class="text-xs">مشتری</label><select onchange="setRp('cust',this.value)"><option value="">همه</option>${customers.map(u=>`<option value="${u.id}" ${String(u.id)===rpF.cust?'selected':''}>${esc(custFull(u))}</option>`).join('')}</select></div>
   <div><label class="text-xs">طرح فروش</label><select onchange="setRp('plan',this.value)"><option value="">همه</option>${[...new Set(invoices.map(i=>i.plan_name).filter(Boolean))].map(x=>`<option ${x===rpF.plan?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
  </div>
  <p class="text-xs text-slate-400 mt-2">بازه: ${jdate(from)} تا ${jdate(to)}</p></div>
 <div class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-3">
  <div class="card p-3"><div class="text-xs text-slate-400">تعداد فاکتور</div><div class="font-bold">${fmt(new Set(rows.map(r=>r.inv.id)).size)}</div></div>
  <div class="card p-3"><div class="text-xs text-slate-400">تعداد کالای فروخته‌شده</div><div class="font-bold">${fmt(tot.qty)}</div></div>
  <div class="card p-3"><div class="text-xs text-slate-400">فروش (بدون مالیات)</div><div class="font-bold text-emerald-400">${fmoney(tot.rev)}</div></div>
  <div class="card p-3"><div class="text-xs text-slate-400">بهای تمام‌شده</div><div class="font-bold text-amber-300">${fmoney(tot.cogs)}</div></div>
  <div class="card p-3"><div class="text-xs text-slate-400">سود ناخالص</div><div class="font-bold ${tot.profit>=0?'text-emerald-400':'text-red-400'}">${fmoney(tot.profit)}</div></div>
  <div class="card p-3"><div class="text-xs text-slate-400">مالیات ارزش افزوده</div><div class="font-bold">${fmoney(tot.vat)}</div></div>
 </div>
 <div class="card p-3 mb-3"><h3 class="font-bold mb-2">سود و زیان این بازه</h3>
  <div class="flex justify-between"><span>سود ناخالص</span><b>${fmoney(tot.profit)}</b></div>
  <div class="flex justify-between text-red-400"><span>هزینه‌ها</span><b>${filtered?'—':fmoney(exp)}</b></div>
  <div class="flex justify-between text-lg mt-1 ${net>=0?'text-emerald-400':'text-red-400'}"><span>${net>=0?'سود خالص':'زیان خالص'}</span><b>${fmoney(Math.abs(net))}</b></div>
  ${filtered?'<p class="text-xs text-slate-400 mt-1">وقتی دسته یا برند انتخاب شده، هزینه‌های عمومی کسر نمی‌شود و فقط سود ناخالص همان گروه نشان داده می‌شود.</p>':''}</div>
 <div class="card p-3 overflow-x-auto"><h3 class="font-bold mb-2">به تفکیک ${byLbl[rpF.by]}</h3>
  <table><thead><tr><th>${byLbl[rpF.by]}</th><th>فاکتور</th><th>تعداد</th><th>فروش</th><th>بهای تمام‌شده</th><th>سود</th></tr></thead><tbody>
  ${ent.map(([k,g])=>`<tr><td>${esc(k)}</td><td>${fmt(g.inv.size)}</td><td>${fmt(g.qty)}</td><td>${fmoney(g.rev)}</td><td>${fmoney(g.cogs)}</td><td class="${g.profit>=0?'text-emerald-400':'text-red-400'}">${fmoney(g.profit)}</td></tr>`).join('')||'<tr><td colspan="6">در این بازه فروشی ثبت نشده</td></tr>'}
  </tbody></table>
  <button class="btn btn-s w-full mt-3" onclick="exportSalesCsv()">⬇️ دریافت فایل اکسل (CSV)</button></div>
 <div class="card p-3 mt-3 overflow-x-auto"><h3 class="font-bold mb-2">فاکتورهای این بازه</h3><table><thead><tr><th>شماره</th><th>تاریخ</th><th>مشتری</th><th>تخفیف</th><th>مبلغ</th><th></th></tr></thead><tbody>${[...new Map(rows.map(r=>[r.inv.id,r.inv])).values()].map(i=>`<tr><td>${esc(invNo(i))}</td><td>${jdate(new Date(i.date))}</td><td>${esc(custName(i))}</td><td>${fmoney(i.discount||0)}</td><td>${fmoney(i.total)}</td><td><button class="btn btn-p text-xs" onclick="showInvoice(${i.id})">🖨 فاکتور</button>${isAdmin()?` <button class="btn btn-s text-xs" onclick="startInvEdit(${i.id})">✏️ ویرایش</button> <button class="btn btn-d text-xs" onclick="delInv(${i.id})">🗑 حذف</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6>—</td></tr>'}</tbody></table></div>`;
 c.insertAdjacentHTML('afterbegin',invEditCard());
 window._rpRows=rows;
}
function exportSalesCsv(){
 const rows=window._rpRows||[];const h=['تاریخ','فاکتور','نوع فروش','محصول','بارکد','دسته','برند','تعداد','فروش','بهای تمام‌شده','سود'];
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const csv='\ufeff'+[h,...rows.map(r=>[jdate(new Date(r.inv.date)),r.inv.id,r.pay,r.name,r.barcode,r.cat,r.brand,r.qty,r.rev,r.cogs,r.profit])].map(l=>l.map(q).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sales-report.csv';a.click();
}
</script>
</body>
</html>
