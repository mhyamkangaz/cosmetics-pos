<script>
/* ===== موتور اسکن بارکد هوشمند با قابلیت پیش‌پردازش عکس گالری ===== */
let html5QrCode = null;
let scanCallback = null;

function openScanModal(cb) {
  scanCallback = cb;
  document.getElementById('scanErr').textContent = '';
  document.getElementById('scanModal').classList.remove('hidden');
  startCameraScan();
}

function closeScanModalHandler() {
  if (html5QrCode && html5QrCode.isScanning) {
    html5QrCode.stop().then(() => {
      document.getElementById('scanModal').classList.add('hidden');
    }).catch(() => {
      document.getElementById('scanModal').classList.add('hidden');
    });
  } else {
    document.getElementById('scanModal').classList.add('hidden');
  }
}

function startCameraScan() {
  const formats = [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.QR_CODE
  ];

  if (!html5QrCode) {
    html5QrCode = new Html5Qrcode("reader", { formatsToSupport: formats, verbose: false });
  }

  const config = { fps: 15, qrbox: { width: 250, height: 160 } };
  html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
    .catch(err => {
      document.getElementById('scanErr').textContent = 'دسترسی دوربین ممکن نیست یا مسدود است.';
    });
}

function onScanSuccess(decodedText) {
  closeScanModalHandler();
  if (scanCallback) scanCallback(decodedText);
}

// تغییر ابعاد تصاویر حجیم گالری برای خوانش دقیق OCR/بارکد
async function preprocessImage(file, maxWidth = 1200) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxWidth || h > maxWidth) {
        if (w > h) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
        else { w = Math.round((w * maxWidth) / h); h = maxWidth; }
      }
      const canvas = document.createElement('canvas
